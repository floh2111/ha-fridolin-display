                                          - label: { id: lbl_h0_regen, text: "", text_font: fridolin_14, text_color: 0x6CB8FF, width: 82, text_align: CENTER }
                                    - obj:
                                        scrollable: false
                                        pad_all: 0
                                        width: 82
                                        height: 138
                                        bg_opa: TRANSP
                                        border_opa: TRANSP
                                        layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, pad_row: 3 }
                                        widgets:
                                          - label: { id: lbl_h1_zeit, text: "--:--", text_font: fridolin_14, width: 82, text_align: CENTER }
