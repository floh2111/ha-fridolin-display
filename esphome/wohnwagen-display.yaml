substitutions:
  name: wohnwagen-display
  friendly_name: Fridolin Display

### Grundgerüst (Waveshare ESP32-S3-Touch-LCD-7, 800x480, 16 MB Flash, 8 MB PSRAM)
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    ### SCROLL_ANIM_TIME_MIN/MAX: LVGL-Standard 200-400 ms fuer die Einrast-Animation
    ### beim Seitenwechsel; bei ~10 Bildern/s wirkt das ruckelig, kuerzer = weniger
    ### sichtbare Zwischenbilder
    build_flags: "-DBOARD_HAS_PSRAM -DSCROLL_ANIM_TIME_MIN=90 -DSCROLL_ANIM_TIME_MAX=160"
    board_build.arduino.memory_type: qio_opi
    board_build.flash_mode: dio
  ### Gespeicherten Fahrzeugtyp (Wohnwagen/Wohnmobil) nach dem Hochfahren
  ### auf Bild + Auswahl-Knoepfe der Nivellierungs-/Einstellungsseite anwenden
  on_boot:
    priority: -100
    then:
      - script.execute: sync_fahrzeugtyp

### Zurueck auf 120MHz (war kurzzeitig auf 80MHz gedrosselt, um den
### Bootloop von CONFIG_SPIRAM_TIMING_TUNING_POINT_VIA_TEMPERATURE_SENSOR
### zu umgehen) - 80MHz bremste die Bildwiederholrate spuerbar aus
### ("lvgl took a long time for an operation", 312ms bei nur 16MHz
### Pixeltakt). Der eigentliche Bootloop-Ausloeser wird jetzt stattdessen
### gezielt durch die components/psram_120mhz_fix/-Komponente
### unterdrueckt (siehe external_components: weiter unten).
psram:
  mode: octal
  speed: 120MHz

### Kalibrier-Nullpunkt der Neigung nicht bei jeder Änderung ins Flash schreiben
preferences:
  flash_write_interval: 5min

### Merkt sich Min-/Max-Temperatur für morgen, damit der kombinierte
### Übersichts-Text unabhängig von der Update-Reihenfolge stimmt
globals:
  ### Zeitpunkt (millis) der letzten Kühlbox-Messung, für die Anzeige Verbunden/Getrennt
  ### Vom Display eingestellte, noch nicht bestaetigte Kuehlbox-Zieltemperatur
  ### (-999 = nichts ausstehend) - zeigt die Aenderung sofort an und lässt
  ### mehrere schnelle Klicks aufeinander aufbauen
  - id: g_kb_pending
    type: float
    restore_value: false
    initial_value: '-999'
  - id: g_kb_letzte
    type: uint32_t
    restore_value: false
    initial_value: '0'
  ### Kalibrierung Neigungssensor: Nullpunkt-Offsets (bleiben nach Neustart
  ### erhalten) und zuletzt berechnete Rohwinkel
  - id: g_offset_lr
    type: float
    restore_value: true
    initial_value: '0'
  - id: g_offset_vh
    type: float
    restore_value: true
    initial_value: '0'
  ### Fahrzeugtyp fuer die Nivellierungs-Seite (false=Wohnwagen, true=Wohnmobil),
  ### bleibt nach Neustart erhalten - umschaltbar in den Einstellungen
  - id: g_fahrzeugtyp_wohnmobil
    type: bool
    restore_value: true
    initial_value: 'false'
  ### Standby: Minuten bis das Display ausgeht (0 = nie), bleibt nach
  ### Neustart erhalten; g_standby_aktiv = Display gerade aus,
  ### g_standby_init = Schieberegler nach dem Start einmal angeglichen
  ### Standort beim Start schon vom Handy geholt? (einmal pro Boot)
  - id: g_standort_geholt
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_standby_min
    type: int
    restore_value: true
    initial_value: '1'
  - id: g_standby_aktiv
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_standby_init
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_roh_lr
    type: float
    restore_value: false
    initial_value: '0'
  - id: g_roh_vh
    type: float
    restore_value: false
    initial_value: '0'
  - id: g_morgen_min
    type: float
    restore_value: false
    initial_value: '0'
  - id: g_morgen_max
    type: float
    restore_value: false
    initial_value: '0'

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      ### PERF (-O2) statt Standard SIZE (-Os): schnelleres Zeichnen/Blending in
      ### LVGL, Wischen wirkte zuletzt wieder traege; kostet nur etwas Flash
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      ### KEIN CONFIG_SPIRAM_MODE_OCT/CONFIG_SPIRAM_SPEED_120M mehr hier -
      ### das macht der psram:-Block oben schon (redundant/doppelt gemoppelt
      ### war vorher sowieso). Wichtiger Grund fuer die 80MHz dort: bei
      ### Octal-PSRAM + 120MHz + enable_idf_experimental_features erzwingt
      ### ESPHomes psram-Komponente selbst, bedingungslos und OHNE
      ### Ruecksicht auf eigene sdkconfig_options-Angaben hier (siehe
      ### components/psram/__init__.py im ESPHome-Quellcode, Zeile ~253:
      ### "if speed == 120: ... add_idf_sdkconfig_option(
      ### 'CONFIG_SPIRAM_TIMING_TUNING_POINT_VIA_TEMPERATURE_SENSOR', True)"
      ### - ein direkter, unbedingter Dict-Write OHNE Existenz-Check, laeuft
      ### nach unserem eigenen sdkconfig_options und ueberschreibt es damit
      ### einfach), ESP-IDFs "PSRAM-Timing per Temperatursensor
      ### nachjustieren"-Feature. Das pruefte beim Booten die
      ### Flash-Hersteller-ID gegen eine Whitelist von nur zwei Herstellern
      ### (0xC8/0x20, components/esp_mspi/mspi_timing_tuning/port/esp32s3/
      ### mspi_timing_by_mspi_delay.c) und brach bei Florians Waveshare-Board
      ### (anderer Flash-Hersteller) sofort ab - "MSPI Timing: The flash
      ### model has not been verified..." + abort() in do_secondary_init,
      ### noch vor unserer eigentlichen Firmware. Ein eigener
      ### sdkconfig_options-Override dagegen half NICHT (siehe Git-Historie:
      ### erst versucht, hat einen kompletten Bootloop-Debug-Umweg über
      ### einen sauberen esphome-clean-Build gebraucht, bis der wahre Grund
      ### im ESPHome-Quellcode selbst gefunden war - 80MHz umgeht das ganze
      ### Problem, da der komplette Codepfad an "if speed == 120" haengt).
      ### Nicht in esphome config/compile sichtbar, nur beim echten Booten -
      ### deshalb erst beim ersten Hardware-Test (30.09.2026) aufgefallen.

logger:

### id: erlaubt on_client_connected/on_client_disconnected weiter unten,
### um den Verbindungs-Hinweis auf der Übersichtsseite zu steuern (siehe
### box_verbindung_verloren) - ohne staendiges Pollen, die Trigger feuern
### direkt bei jeder Zustandsaenderung der API-Verbindung zu Home Assistant.
api:
  id: fridolin_api
  encryption:
    key: !secret fridolin_api_key
  on_client_connected:
    - lvgl.widget.update:
        id: box_verbindung_verloren
        hidden: true
    ### Standort vom Handy automatisch uebernehmen: einmal pro Display-Start
    ### (nicht bei jedem spaeteren Wiederverbinden, z.B. nach einem Neustart
    ### von Home Assistant). Liefert das Handy gerade keine Position, bleibt
    ### in der Integration der zuletzt gespeicherte Standort bestehen.
    - if:
        condition:
          lambda: 'return !id(g_standort_geholt);'
        then:
          ### Kurz warten: direkt nach dem Verbinden hat Home Assistant
          ### Aktionen noch nicht abonniert, der Aufruf wuerde sonst
          ### verworfen ("client has not subscribed to actions (yet)").
          - delay: 10s
          - lambda: 'id(g_standort_geholt) = true;'
          - homeassistant.action:
              action: button.press
              data:
                entity_id: button.fridolin_standort_uebernehmen
  on_client_disconnected:
    - lvgl.widget.update:
        id: box_verbindung_verloren
        hidden: false

ota:
  - platform: esphome
    password: !secret fridolin_ota_password

### Zweite Sicherheitsebene fuer Flash-/OTA-Probleme (die erste ist bereits
### automatisch aktiv, ganz ohne Konfiguration hier: ESP-IDFs eingebautes
### App-Rollback ueber die zwei OTA-Partitionen app0/app1 - siehe
### CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE in .esphome/build/.../sdkconfig.
### Eine neu geflashte Firmware, die abstuerzt/neu startet ohne sich als
### funktionsfaehig zu bestaetigen, wird vom Bootloader beim naechsten Boot
### automatisch verworfen - zurueck zur vorherigen, funktionierenden
### Partition, kein Zutun noetig).
###
### safe_mode: deckt den Fall ab, den das Bootloader-Rollback NICHT
### abdeckt: eine Firmware, die zwar startet und laeuft, aber z.B. wegen
### falscher WLAN-Zugangsdaten oder eines Konfigurationsfehlers nie WLAN/
### API erreicht - ohne Absturz gibt es fuer den Bootloader nichts zu
### erkennen. Nach mehreren erfolglosen Boots in Folge (jeweils ohne
### mindestens boot_is_good_after WLAN/API-Verbindung) startet das ESP
### stattdessen in einen minimalen Modus nur mit WLAN+OTA, ueber den sich
### per Netzwerk wieder eine funktionierende Firmware aufspielen laesst -
### auch wenn der Wohnwagen gerade nicht direkt zugaenglich ist.
safe_mode:
  num_attempts: 5
  boot_is_good_after: 2min
  reboot_timeout: 10min

wifi:
  ssid: !secret fridolin_wifi_ssid
  password: !secret fridolin_wifi_password
  power_save_mode: none
  ### Feste IP statt DHCP+mDNS-Aufloesung bei jedem Verbindungsaufbau -
  ### schneller/zuverlaessiger, SOLANGE der Router diese IP dem Geraet
  ### stabil zuteilt (idealerweise per DHCP-Reservierung auf die MAC-
  ### Adresse im Router fixieren, sonst kann sich die IP trotzdem mal
  ### aendern und use_address zeigt dann ins Leere).
  use_address: 192.168.10.34

### Eigene HA-Entity, die anzeigt, ob das Display gerade online/per API
### verbunden ist (unabhaengig vom Verbindungs-Hinweis auf dem Display
### selbst - dieser hier ist von HA-Seite aus sichtbar, z.B. fuer ein
### Dashboard oder eine Benachrichtigung "Fridolin Display ist offline").
binary_sensor:
  - platform: status
    name: "Geräte Status"

time:
  - platform: homeassistant
    id: ha_time

### I2C-Bus: Touch-Controller (GT911) und Neigungssensor (GY-521 / MPU6050) hängen hier gemeinsam dran
i2c:
  sda: GPIO08
  scl: GPIO09
  scan: true
  id: bus_a

### IO-Expander des Boards (steuert u.a. Backlight, Reset-Leitungen)
ch422g:
  - id: ch422g_hub

### ------------------------------------------------------------------
### Display & Touch (Pinbelegung für das Waveshare ESP32-S3-Touch-LCD-7, 800x480)
### ------------------------------------------------------------------
display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red: [1, 2, 42, 41, 40]
      green: [39, 0, 45, 48, 47, 21]
      blue: [14, 38, 18, 17, 10]

touchscreen:
  platform: gt911
  id: my_touch
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT

### ------------------------------------------------------------------
### Kühlbox direkt per Bluetooth (Tuya BLE), ohne Home Assistant.
### Komponente: eigener Fork, fest auf einen geprüften Commit gepinnt.
### Secrets: fridolin_kuehlbox_mac / _device_id / _uuid / _local_key.
### Die Kühlbox nimmt nur EINE Verbindung an: Tuya-App und die Home-
### Assistant-Integration "Tuya BLE" müssen getrennt/deaktiviert sein.
### ------------------------------------------------------------------
external_components:
  ### Eigene kleine lokale Komponente (components/psram_120mhz_fix/), die
  ### PSRAM trotz 120MHz bootfaehig haelt - siehe deren Docstring und
  ### CLAUDE.md fuer die volle Herleitung des Bootloops, den 120MHz ohne
  ### diesen Fix verursacht.
  - source:
      type: local
      path: components

psram_120mhz_fix:

### window nahe am interval (hier vorher 300ms von 320ms, ~94% Duty-Cycle)
### belegt fast staendig den einen gemeinsamen 2,4GHz-Funk von WiFi UND
### Bluetooth auf dem ESP32-S3 - WLAN kommt dadurch nie ueber "Starting
### scan" hinaus (gefunden beim ersten Hardware-Test mit WLAN+Kuehlbox
### zusammen, 30.09.2026: "WiFi: Connected: NO" im Log, nie eine IP
### bekommen). interval bewusst gleich gelassen (Kuehlbox-Scan bleibt
### gleich oft dran), nur window stark verkuerzt - sollte fuer Tuya-BLE-
### Advertisements (deutlich kuerzeres Intervall als 320ms) weiterhin
### reichen, gibt WLAN aber ~90% mehr Funkzeit.
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms

tuya_ble_tracker:

### timeout: 60s statt Standard 2s - die Verbindung zur Kuehlbox bleibt nach
### jeder Aktion 60 s offen (und wird vom 30s-Update auf der offenen
### Verbindung am Leben gehalten), sonst musste jeder Tastendruck die
### komplette Verbindung (Suchen, Verbinden, Koppeln) neu aufbauen.
tuya_ble_client:
  - id: tuya_client
    timeout: 60s

tuya_ble_node:
  - id: kuehlbox
    mac_address: !secret fridolin_kuehlbox_mac
    local_key: !secret fridolin_kuehlbox_local_key
    device_id: !secret fridolin_kuehlbox_device_id
    uuid: !secret fridolin_kuehlbox_uuid
    tuya_ble_client_id: tuya_client
    update_interval: 30s
    max_queued: 5

select:
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 103
    name: "Kühlbox Modus"
    id: kb_modus_sel
    options: ["MAX", "ECO"]
    on_value:
      - script.execute: sync_kuehlbox
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 104
    name: "Kühlbox Batterieschutz"
    id: kb_batt_sel
    options: ["L", "M", "H"]
    on_value:
      - script.execute: sync_kuehlbox
  ### Zieltemperatur als Dropdown für Home Assistant (-20 bis 20 °C)
  - platform: template
    name: "Kühlbox Zieltemperatur"
    id: kb_ziel_auswahl
    optimistic: true
    options:
      - "-20 °C"
      - "-19 °C"
      - "-18 °C"
      - "-17 °C"
      - "-16 °C"
      - "-15 °C"
      - "-14 °C"
      - "-13 °C"
      - "-12 °C"
      - "-11 °C"
      - "-10 °C"
      - "-9 °C"
      - "-8 °C"
      - "-7 °C"
      - "-6 °C"
      - "-5 °C"
      - "-4 °C"
      - "-3 °C"
      - "-2 °C"
      - "-1 °C"
      - "0 °C"
      - "1 °C"
      - "2 °C"
      - "3 °C"
      - "4 °C"
      - "5 °C"
      - "6 °C"
      - "7 °C"
      - "8 °C"
      - "9 °C"
      - "10 °C"
      - "11 °C"
      - "12 °C"
      - "13 °C"
      - "14 °C"
      - "15 °C"
      - "16 °C"
      - "17 °C"
      - "18 °C"
      - "19 °C"
      - "20 °C"
    set_action:
      - number.set:
          id: kb_ziel
          value: !lambda 'return (float) atoi(x.c_str());'

number:
  ### Interne Zahl: sendet die Zieltemperatur an die Kühlbox (Display und Dropdown nutzen sie)
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 114
    name: "Kühlbox Zieltemperatur Zahl"
    id: kb_ziel
    internal: true
    unit_of_measurement: "°C"
    min_value: -20
    max_value: 20
    step: 1
    mode: box
    on_value:
      - lambda: |-
          if (id(g_kb_pending) > -900 && fabsf(x - id(g_kb_pending)) < 0.5f) id(g_kb_pending) = -999;
          id(kb_ziel_auswahl).publish_state(str_sprintf("%d °C", (int) roundf(x)));
      - script.execute: sync_kuehlbox

### Anzeige regelmäßig auffrischen (Verbunden/Getrennt hängt an der Zeit seit der letzten Messung)
interval:
  - interval: 10s
    then:
      - script.execute: sync_kuehlbox
  - interval: 15s
    then:
      - script.execute: sync_uhrzeit
  ### Standby: jede Sekunde Inaktivitaet pruefen (statt on_idle, dessen
  ### Timeout zur Compile-Zeit fest waere - hier einstellbar per Schieberegler).
  ### Der Schieberegler wird nach dem Start einmal an den gespeicherten Wert
  ### angeglichen (bewusst hier statt in on_boot, damit der Generator-Anker
  ### fuer den Fahrzeugtyp-on_boot unberuehrt bleibt).
  - interval: 1s
    then:
      - lambda: |-
          if (!id(g_standby_init)) {
            id(g_standby_init) = true;
            id(sync_standby).execute();
            // Wisch-Physik: scroll_throw 1 (Standard 10) = Schwung laeuft laenger
            // nach, dadurch reicht ein kurzes Wischen fuer den Seitenwechsel;
            // scroll_limit 3 (Standard 10) = Wischen beginnt frueher
            for (lv_indev_t *i = lv_indev_get_next(NULL); i != NULL; i = lv_indev_get_next(i)) {
              lv_indev_set_scroll_throw(i, 1);
              lv_indev_set_scroll_limit(i, 3);
            }
          }
          if (id(g_standby_aktiv) || id(g_standby_min) <= 0) return;
          if (lv_display_get_inactive_time(NULL) > (uint32_t) id(g_standby_min) * 60000UL) {
            id(g_standby_aktiv) = true;
            id(lcdbacklight).turn_off();
            lv_obj_remove_flag(id(overlay_wake), LV_OBJ_FLAG_HIDDEN);
          }

### ------------------------------------------------------------------
### Wetter-Icons: SVGs aus esphome/images/weather/, von ESPHome per
### resvg beim Kompilieren in zwei Größen gerastert (groß: Übersicht,
### klein: Stunden-Slots und Morgen-Ausblick). Auswahl über die beiden
### mapping:-Blöcke unten, gefüttert von den *_icon-Sensoren aus der
### Fridolin-Display-Integration (icon-Schlüssel = Dateiname ohne .svg).
### ------------------------------------------------------------------
image:
  ### Zahnrad-Icon fuer den Einstellungen-Knopf (esphome/images/zahnrad.svg,
  ### selbst gezeichnet) - ersetzt das Unicode-Zeichen "⚙", das in keiner
  ### regulaeren Text-Schriftart (z.B. Montserrat) als Glyph enthalten ist.
  - platform: file
    id: img_zahnrad
    file: images/zahnrad.svg
    resize: 24x24
    type: RGB565
    transparency: alpha_channel

  ### Schematischer Wohnwagen-Grundriss mit Kreuzlibelle (siehe
  ### esphome/images/wasserwaage.svg), in nativer Auflösung gerastert
  ### (460x300, deckungsgleich mit dem SVG-viewBox) - die Blasen-Overlays
  ### unten rechnen deshalb direkt mit den SVG-Koordinaten, ohne Skalierung.
