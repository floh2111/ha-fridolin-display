  - platform: homeassistant
    id: morgen_icon
    entity_id: sensor.fridolin_wetter_morgen_icon
    on_value:
      - lvgl.image.update:
          id: img_morgen_icon
          src:
            mapping: icon_map_klein
            value: !lambda return x;

  ### Zeitpunkt der letzten Standortübernahme, nur zur Anzeige auf der
  ### Einstellungsseite (Helfer wird von einem HA-Skript gesetzt)
  - platform: homeassistant
    id: ha_standort_status
    entity_id: sensor.fridolin_standort_status
    on_value:
      - lvgl.label.update:
          id: lbl_standort_status
          text: !lambda return x;

  ### Vier Stunden-Slots: nur die Uhrzeit als Text, Temperatur kommt
  ### unten als eigener sensor-Eintrag
  - platform: homeassistant
    id: h0_zeit
    entity_id: sensor.fridolin_wetter_h0_zeit
    on_value:
      - lvgl.label.update: { id: lbl_h0_zeit, text: !lambda return x; }
  - platform: homeassistant
    id: h1_zeit
    entity_id: sensor.fridolin_wetter_h1_zeit
    on_value:
      - lvgl.label.update: { id: lbl_h1_zeit, text: !lambda return x; }
  - platform: homeassistant
    id: h2_zeit
    entity_id: sensor.fridolin_wetter_h2_zeit
    on_value:
      - lvgl.label.update: { id: lbl_h2_zeit, text: !lambda return x; }
  - platform: homeassistant
    id: h3_zeit
    entity_id: sensor.fridolin_wetter_h3_zeit
    on_value:
      - lvgl.label.update: { id: lbl_h3_zeit, text: !lambda return x; }

  ### Ausblick auf morgen: Zustandstext (min/max-Temperatur kommen als
  ### sensor-Einträge weiter unten)
  - platform: homeassistant
    id: morgen_zustand
    entity_id: sensor.fridolin_wetter_morgen_zustand
    on_value:
      - lvgl.label.update:
          id: lbl_morgen_zustand
          text: !lambda return x;

### ------------------------------------------------------------------
### Neigungssensor GY-521 (MPU6050), physisch direkt am ESP32/Display
### für die Nivellierungs-Seite
### ------------------------------------------------------------------
sensor:
  ### Kühlbox-Werte (direkt per Bluetooth)
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 112
    name: "Kühlbox Temperatur"
    id: kb_ist
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    on_value:
      - lambda: 'id(g_kb_letzte) = millis();'
      - script.execute: sync_kuehlbox
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 123
    name: "Kühlbox Batterie"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 122
    name: "Kühlbox Spannung"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    # Datenpunkt 122 liefert Zehntelvolt (145 = 14,5 V)
    filters:
      - multiply: 0.1

  ### Ziel-/Solltemperatur der climate-Entität (Attribut "temperature")
  - platform: homeassistant
    id: ha_zieltemperatur
    entity_id: climate.fridolin_heizung
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: lbl_zieltemperatur
          ### Komma statt Punkt als Dezimaltrennzeichen (deutsche Schreibweise)
          text: !lambda |-
            std::string s = str_sprintf("%.1f °C", x);
            for (auto &c : s) if (c == '.') c = ',';
            return s;

  ### Ist-Temperatur der Klimaanlage (Attribut "current_temperature") - legt
  ### fest, wo der Ring von rot (kälter) auf blau (wärmer) umschlägt
  - platform: homeassistant
    id: ha_klima_ist
    entity_id: climate.fridolin_heizung
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_klima_ist
          text: !lambda |-
            std::string s = str_sprintf("Ist: %.1f °C", x);
            for (auto &c : s) if (c == '.') c = ',';
            return s;
      - lambda: |-
          float ist = std::max(16.0f, std::min(30.0f, x));
          lv_arc_set_value(id(arc_klima_kalt), (int) ist);
          lv_arc_set_range(id(arc_klima_warm), (int) ist, 30);
          lv_arc_set_value(id(arc_klima_warm), 30);

  ### Aktuelle Außentemperatur (großer Wert auf der Übersicht)
  - platform: homeassistant
    id: wetter_temp_uebersicht
    entity_id: sensor.fridolin_wetter_temperatur
    on_value:
      - lvgl.label.update:
          id: lbl_wetter_temp
          ### Komma statt Punkt als Dezimaltrennzeichen (deutsche Schreibweise)
          text: !lambda |-
            std::string s = str_sprintf("%.1f °C", x);
            for (auto &c : s) if (c == '.') c = ',';
            return s;

  ### Temperaturen der vier Stunden-Slots
  - platform: homeassistant
    id: h0_temp
    entity_id: sensor.fridolin_wetter_h0_temp
    on_value:
      - lvgl.label.update: { id: lbl_h0_temp, text: { format: "%.0f°", args: ["x"] } }
  - platform: homeassistant
    id: h1_temp
    entity_id: sensor.fridolin_wetter_h1_temp
    on_value:
      - lvgl.label.update: { id: lbl_h1_temp, text: { format: "%.0f°", args: ["x"] } }
  - platform: homeassistant
    id: h2_temp
    entity_id: sensor.fridolin_wetter_h2_temp
    on_value:
      - lvgl.label.update: { id: lbl_h2_temp, text: { format: "%.0f°", args: ["x"] } }
  - platform: homeassistant
    id: h3_temp
    entity_id: sensor.fridolin_wetter_h3_temp
    on_value:
      - lvgl.label.update: { id: lbl_h3_temp, text: { format: "%.0f°", args: ["x"] } }

  ### Morgen: Minimal- und Maximaltemperatur. Beide Werte werden in den
  ### globals unten gemerkt, damit sich der Label-Text immer komplett
  ### neu aus beiden aktuellen Werten zusammensetzt (kein Aneinanderhängen,
  ### das sich bei jedem HA-Update wiederholen und den Text verlängern würde)
  - platform: homeassistant
    id: morgen_min
    entity_id: sensor.fridolin_wetter_morgen_min
    on_value:
      - globals.set: { id: g_morgen_min, value: !lambda return x; }
      - lvgl.label.update:
          id: lbl_morgen_range
          text:
            format: "Morgen: %.0f° – %.0f°"
            args: ["id(g_morgen_min)", "id(g_morgen_max)"]
  - platform: homeassistant
    id: morgen_max
    entity_id: sensor.fridolin_wetter_morgen_max
    on_value:
      - globals.set: { id: g_morgen_max, value: !lambda return x; }
      - lvgl.label.update:
          id: lbl_morgen_range
          text:
            format: "Morgen: %.0f° – %.0f°"
            args: ["id(g_morgen_min)", "id(g_morgen_max)"]

  ### Glaettung der rohen Beschleunigungswerte gegen Zittern/Vibration:
  ### median filtert einzelne Ausreisser (z.B. ein kurzer Stoss/Erschuetterung)
  ### heraus, exponential_moving_average glaettet den Rest. Wirkt auf accel_x/
  ### y/z VOR der atan2()-Berechnung weiter unten - beide Neigungswerte (und
  ### der per "Nullen"-Knopf gespeicherte Nullpunkt, der direkt aus den
  ### aktuellen Rohwerten uebernommen wird) profitieren dadurch gemeinsam,
  ### ohne die Berechnung selbst anzufassen. Bei window_size: 5 und
  ### update_interval: 200ms macht sich eine echte Neigungsaenderung nach
  ### ca. 1-2s bemerkbar statt sofort - spuerbar ruhiger, aber nicht traege.
  - platform: mpu6050
    address: 0x68
    i2c_id: bus_a
    update_interval: 200ms
    accel_x:
      id: accel_x
      filters: &neigung_filter
        - median:
            window_size: 5
            send_every: 1
            send_first_at: 1
        - exponential_moving_average:
            alpha: 0.2
            send_every: 1
    accel_y:
      id: accel_y
      filters: *neigung_filter
    accel_z:
      id: accel_z
      filters: *neigung_filter

  ### Kippwinkel links/rechts (Roll) aus den Beschleunigungswerten berechnet
  - platform: template
    id: neigung_links_rechts
    name: Neigung links-rechts
    unit_of_measurement: "°"
    update_interval: 200ms
    lambda: |-
      float roh = atan2(id(accel_y).state, id(accel_z).state) * 180.0 / M_PI;
      id(g_roh_lr) = roh;
      return roh - id(g_offset_lr);
    on_value:
      - lvgl.label.update:
          id: lbl_neigung_lr
          text:
            format: "%.1f°"
            args: ["x"]
      ### Blase in der senkrechten Libelle (quer zur Fahrtrichtung) nach oben/unten
      ### bewegen: +-8 Grad Vollausschlag (reale Wasserwaagen sind sehr empfindlich),
      ### darüber bleibt sie am Rand stehen. Bild wird 1:1 (ohne Skalierung)
      ### gerastert, daher direkt die SVG-Koordinaten: Mitte y=140, minus halbe
      ### Blasenhöhe (30/2=15) -> 125, Hub ±37px.
      - lambda: |-
          float clamped = std::max(-8.0f, std::min(8.0f, x));
          lv_obj_set_y(id(bubble_lr), 125 + (int) (clamped / 8.0f * 37.0f));
          bool eben = fabsf(x) < 1.0f;
          lv_obj_set_style_border_color(id(bubble_lr), eben ? lv_color_hex(0x3FA34D) : lv_color_hex(0xB9AE63), 0);
          lv_obj_set_style_border_width(id(bubble_lr), eben ? 3 : 1, 0);

  ### Kippwinkel vorne/hinten (Pitch) aus den Beschleunigungswerten berechnet
  - platform: template
    id: neigung_vorne_hinten
    name: Neigung vorne-hinten
    unit_of_measurement: "°"
    update_interval: 200ms
    lambda: |-
      float roh = atan2(-id(accel_x).state, sqrt(id(accel_y).state * id(accel_y).state + id(accel_z).state * id(accel_z).state)) * 180.0 / M_PI;
      id(g_roh_vh) = roh;
      return roh - id(g_offset_vh);
    on_value:
      - lvgl.label.update:
          id: lbl_neigung_vh
          text:
            format: "%.1f°"
            args: ["x"]
      ### Blase in der waagerechten Libelle (in Fahrtrichtung) seitlich bewegen.
      ### Bild wird 1:1 (ohne Skalierung) gerastert, daher direkt die SVG-
      ### Koordinaten: Mitte x=155, minus halbe Blasenbreite (30/2=15) -> 140, Hub ±37px.
      - lambda: |-
          float clamped = std::max(-8.0f, std::min(8.0f, x));
          lv_obj_set_x(id(bubble_vh), 140 + (int) (clamped / 8.0f * 37.0f));
          bool eben = fabsf(x) < 1.0f;
          lv_obj_set_style_border_color(id(bubble_vh), eben ? lv_color_hex(0x3FA34D) : lv_color_hex(0xB9AE63), 0);
          lv_obj_set_style_border_width(id(bubble_vh), eben ? 3 : 1, 0);

### Nullt die Neigungsanzeige auf die aktuelle Lage (auch aus Home Assistant bedienbar)
button:
  - platform: template
    name: Neigung nullen
    on_press:
      - script.execute: neigung_nullen

### ------------------------------------------------------------------
### Nicht belegte Slots ausblenden: Lichter ohne Zustand aus Home Assistant
### und eine nicht eingerichtete Heizung werden auf dem Display versteckt
### ------------------------------------------------------------------
script:
  ### Uhrzeit + Datum für die Übersicht (deutsches Format, kein
  ### locale-abhängiges strftime nötig)
  - id: sync_uhrzeit
    then:
      - lambda: |-
          static const char *const wochentag[8] = {"", "So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"};
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          lv_label_set_text_fmt(id(lbl_uhrzeit), "%02u:%02u", t.hour, t.minute);
          lv_label_set_text_fmt(id(lbl_datum), "%s, %02u.%02u.", wochentag[t.day_of_week], t.day_of_month, t.month);

  - id: sync_kuehlbox
    then:
      - lambda: |-
          bool frisch = id(g_kb_letzte) != 0 && (millis() - id(g_kb_letzte)) < 180000;
          bool an = id(kb_power).state;
          bool hat_ziel = id(kb_ziel).has_state();
          bool hat_ist = id(kb_ist).has_state();
          float z = id(kb_ziel).state;
          float ist = id(kb_ist).state;
          const char *status = !frisch ? "Keine Daten" : (!an ? "Aus" : ((hat_ziel && hat_ist && ist > z) ? "Kuehlt" : "Bereit"));
          lv_label_set_text(id(lbl_kb_status), status);
          if (hat_ziel) {
            lv_label_set_text_fmt(id(lbl_kb_ziel), "%d", (int) roundf(z));
            lv_arc_set_value(id(arc_kb), (int) roundf(z));
          }
          if (hat_ist) lv_label_set_text_fmt(id(lbl_kb_ist), "Ist: %d °C", (int) roundf(ist));
          lv_label_set_text(id(lbl_kb_verbindung), frisch ? "Verbunden" : "Getrennt");
          auto setzen = [](lv_obj_t *o, bool an) {
            if (an) lv_obj_add_state(o, LV_STATE_CHECKED);
            else lv_obj_clear_state(o, LV_STATE_CHECKED);
          };
          setzen(id(btn_kb_power), frisch && an);
          auto mi = id(kb_modus_sel).active_index();
          setzen(id(btn_kb_max), mi.has_value() && *mi == 0);
          setzen(id(btn_kb_eco), mi.has_value() && *mi == 1);
          auto bi = id(kb_batt_sel).active_index();
          setzen(id(btn_kb_bl), bi.has_value() && *bi == 0);
          setzen(id(btn_kb_bm), bi.has_value() && *bi == 1);
          setzen(id(btn_kb_bh), bi.has_value() && *bi == 2);

  - id: neigung_nullen
    then:
      - lambda: |-
          id(g_offset_lr) = id(g_roh_lr);
          id(g_offset_vh) = id(g_roh_vh);
      - component.update: neigung_links_rechts
      - component.update: neigung_vorne_hinten

  ### Schaltet die Grundriss-Grafik der Nivellierungs-Seite um (Wohnwagen/
  ### Wohnmobil) und synchronisiert die beiden Auswahl-Knoepfe auf der
  ### Einstellungsseite. Die Libellen-Bubbles bleiben unberuehrt, weil
  ### beide Bilder dieselben Roehren-Koordinaten verwenden.
  - id: sync_fahrzeugtyp
    then:
      - if:
          condition:
            lambda: 'return id(g_fahrzeugtyp_wohnmobil);'
          then:
            - lvgl.image.update:
                id: img_wasserwaage_widget
                src: img_wohnmobil
          else:
            - lvgl.image.update:
                id: img_wasserwaage_widget
                src: img_wasserwaage
      - lambda: |-
          auto setzen = [](lv_obj_t *o, bool an) {
            if (an) lv_obj_add_state(o, LV_STATE_CHECKED);
            else lv_obj_clear_state(o, LV_STATE_CHECKED);
          };
          setzen(id(btn_fahrzeug_wohnwagen), !id(g_fahrzeugtyp_wohnmobil));
          setzen(id(btn_fahrzeug_wohnmobil), id(g_fahrzeugtyp_wohnmobil));

  - id: sync_lichter
    then:
      - lambda: |-
          lv_obj_t *btns[4] = {id(btn_licht_1), id(btn_licht_2), id(btn_licht_3), id(btn_licht_4)};
          text_sensor::TextSensor *ts[4] = {id(ha_licht_1), id(ha_licht_2), id(ha_licht_3), id(ha_licht_4)};
          int sichtbar = 0;
          for (int i = 0; i < 4; i++) {
            const std::string &s = ts[i]->state;
            bool da = ts[i]->has_state() && !s.empty() && s != "unavailable" && s != "unknown";
            if (da) {
              lv_obj_clear_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
              sichtbar++;
            } else {
              lv_obj_add_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
            }
            if (s == "on") lv_obj_add_state(btns[i], LV_STATE_CHECKED);
            else lv_obj_clear_state(btns[i], LV_STATE_CHECKED);
          }
          if (sichtbar > 0) lv_obj_add_flag(id(lbl_keine_lichter), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(lbl_keine_lichter), LV_OBJ_FLAG_HIDDEN);

  ### Klimaanlage: Sichtbarkeit, Status-Text sowie Modus-/Programm-Knöpfe
  ### zusammen aktualisieren, sobald sich Zustand oder Preset ändern
  - id: sync_klima
    then:
      - lambda: |-
          const std::string &s = id(ha_heizung_modus).state;
          bool da = id(ha_heizung_modus).has_state() && !s.empty() && s != "unavailable" && s != "unknown";
          lv_obj_t *steuerung[] = {
            id(arc_klima_kalt), id(arc_klima_warm), id(lbl_klima_status),
            id(lbl_zieltemperatur), id(lbl_klima_ist),
            id(btn_klima_runter), id(btn_klima_hoch),
            id(lbl_klima_modus_titel), id(btn_klima_aus), id(btn_klima_heizen), id(btn_klima_kuehlen),
            id(lbl_klima_programm_titel), id(btn_klima_eco), id(btn_klima_normal), id(btn_klima_max),
          };
          for (lv_obj_t *o : steuerung) {
            if (da) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
          if (da) lv_obj_add_flag(id(lbl_keine_heizung), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(lbl_keine_heizung), LV_OBJ_FLAG_HIDDEN);

          lv_label_set_text(id(lbl_klima_status), !da ? "Nicht verfuegbar" : (s == "heat" ? "Heizt" : (s == "cool" ? "Kuehlt" : "Aus")));

          auto setzen = [](lv_obj_t *o, bool an) {
            if (an) lv_obj_add_state(o, LV_STATE_CHECKED);
            else lv_obj_clear_state(o, LV_STATE_CHECKED);
          };
          setzen(id(btn_klima_aus), s == "off");
          setzen(id(btn_klima_heizen), s == "heat");
          setzen(id(btn_klima_kuehlen), s == "cool");

          const std::string &preset = id(ha_klima_preset).state;
          setzen(id(btn_klima_eco), preset == "eco");
          setzen(id(btn_klima_normal), preset == "normal");
          setzen(id(btn_klima_max), preset == "max");

### ------------------------------------------------------------------
### Eigene Schriftart statt LVGLs eingebauter montserrat_14/20/28/40-
### Bitmap-Fonts, damit deutsche Umlaute/ß/Sonderzeichen auf dem Display
### erscheinen - die eingebauten LVGL-Fonts kennen nur reines ASCII. Die
### frühere Ersatzschreibweise "Kuehlbox" (statt "Kühlbox") ist damit
### ebenfalls entfallen. Gleiche Google-Font-Familie (Montserrat) wie vorher,
### nur ueber ESPHomes eigenen Font-Renderer geladen statt LVGLs Bitmap-
### Shortcut.
###
### WICHTIG, per Hardware-Test (30.09.2026) korrigiert: eigene IDs
### (fridolin_14/20/28/40) statt der alten montserrat_14/20/28/40 - ein
### eigener font:-Eintrag mit einer ID wie "montserrat_20" wird NICHT
### automatisch von LVGL verwendet, wie urspruenglich angenommen. ESPHomes
### LVGL-Komponente prueft bei jedem text_font:/default_font: zuerst, ob
### der Name in einer FEST VERDRAHTETEN Liste bekannter LVGL-Bitmap-Font-
### Namen steht (components/lvgl/defines.py: LV_FONTS = ["montserrat_8",
### "montserrat_10", ..., "montserrat_48", "dejavu_16_persian_hebrew",
### "simsun_16_cjk", "unscii_8", "unscii_16"] - alle geraden Groessen 8-48
### sind also reserviert), und wenn ja, wird IMMER der eingebaute
### ASCII-only-Bitmap-Font verwendet (components/lvgl/lv_validation.py,
### is_lv_font()) - komplett unabhaengig davon, ob ein eigener font:-
### Eintrag mit exakt dieser ID existiert. Der eigene Font wurde zwar
### fehlerfrei mit allen Umlaut-Glyphen kompiliert (sonst haette der
### Compile-Schritt selbst schon gemeckert, siehe "Emoji-artige Symbole"-
### Eintrag weiter unten), aber NIE tatsaechlich von einem Widget benutzt -
### auf echter Hardware zeigten sich deshalb weiterhin Kaestchen statt
### Umlaute, obwohl esphome config/compile beide grün waren. Mit eigenen,
### garantiert NICHT in LV_FONTS stehenden IDs (fridolin_*) umgangen.
### Zeichensatz: ASCII + Umlaute/ß/Grad/Plusminus/Gedankenstriche + Euro-
### Zeichen (fuer kuenftige sensors-Seiten mit beliebigen, per Entity-
### Picker gewaehlten HA-Entity-Namen, siehe config_flow.py). Das
### Zahnrad-Symbol fuer den Einstellungen-Button ist bewusst KEIN
### Font-Glyph (normale Text-Schriftarten wie Montserrat enthalten kein
### "⚙") - siehe stattdessen img_zahnrad weiter unten (eigenes SVG-Icon).
### ------------------------------------------------------------------
font:
  - file: "gfonts://Montserrat"
    id: fridolin_14
    size: 14
    glyphs: &deutsche_zeichen
      - ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
      - '°±ÄÖÜßäöü–—€'
  - file: "gfonts://Montserrat"
    id: fridolin_20
    size: 20
    glyphs: *deutsche_zeichen
  - file: "gfonts://Montserrat"
    id: fridolin_28
    size: 28
    glyphs: *deutsche_zeichen
  - file: "gfonts://Montserrat"
    id: fridolin_40
    size: 40
    glyphs: *deutsche_zeichen

### ------------------------------------------------------------------
### LVGL-Oberfläche: 5 Seiten als Wisch-Karussell (tileview)
### Übersicht -> Licht -> Heizung -> Nivellierung
### ------------------------------------------------------------------
lvgl:
  id: ui
  color_depth: 16
  ### War 25% - bei RGB-Parallel-Displays (mipi_rgb) heisst das: LVGL
  ### braucht 4 Render+Flush-Zyklen fuer einen vollen Seitenwechsel statt
  ### einem. Bei Florians erstem Hardware-Test (30.09.2026) zeigten sich
  ### dadurch ein spuerbar traeges/hakeliges Wisch-Karussell und
  ### Grafikfehler bei Bildaenderungen (vermutlich unvollstaendige/
  ### ueberholte Teil-Flushes). 100% (voller Bildschirmpuffer) behebt
  ### beides typischerweise bei RGB-Displays - PSRAM hat mit 8 MB reichlich
  ### Luft (ein voller 800x480-RGB565-Puffer sind nur ~750 KB).
  buffer_size: 100%
  default_font: fridolin_20

  theme:
    button:
      bg_color: 0x2B3A55
      bg_opa: COVER
      radius: 12
      checked:
        bg_color: 0xF53B3B
      text_color: 0xFFFFFF
    label:
      text_color: 0xFFFFFF

  pages:
    - id: seiten
      bg_color: 0x101820
      widgets:
        ### Wisch-Karussell: nach links/rechts wischen wechselt die Seite
        - tileview:
            id: tv_seiten
            scrollbar_mode: "OFF"
            bg_color: 0x101820
            tiles:
              ### Seite 1: Übersicht mit Wetter
              - id: tile_uebersicht
                row: 0
                column: 0
                dir: HOR
                widgets:
                  - label:
                      text: "Fridolin"
                      text_font: fridolin_20
                      align: TOP_MID
                      y: 10

                  ### Verbindungs-Hinweis: nur sichtbar, wenn die API-Verbindung zu
                  ### Home Assistant unterbrochen ist (siehe api: on_client_connected/
                  ### on_client_disconnected weiter oben) - Wetter/Licht/Klimaanlage
                  ### zeigen sonst kommentarlos nur noch den letzten bekannten Stand.
                  ### Start-Zustand optimistisch "verbunden" (ausgeblendet), da die
                  ### Verbindung normalerweise innerhalb weniger Sekunden nach dem
                  ### Booten steht.
                  - obj:
                      scrollable: false
                      id: box_verbindung_verloren
                      align: TOP_LEFT
                      x: 12
                      y: 14
                      width: 150
                      height: 24
                      hidden: true
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: START
                        flex_align_cross: CENTER
                        pad_column: 6
                      widgets:
                        - obj:
                            scrollable: false
                            width: 12
                            height: 12
                            radius: 6
                            bg_color: 0xF53B3B
                            bg_opa: COVER
                            border_opa: TRANSP
                        - label:
                            text: "Keine Verbindung"
                            text_font: fridolin_14

                  ### Vier Felder: oben links Wetter + Stundenvorhersage, oben rechts
                  ### Uhrzeit/Datum/Standort + Morgen-Ausblick. Unten bleibt erstmal frei.
                  - obj:
                      scrollable: false
                      align: TOP_MID
                      y: 42
                      width: 720
                      height: 300
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: START
                      widgets:
                        ### Oben links: aktuelles Wetter + die vier Stunden-Slots
                        - obj:
                            scrollable: false
                            width: 340
                            height: 300
                            bg_opa: TRANSP
                            border_opa: TRANSP
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                              pad_row: 14
                            widgets:
                              - obj:
                                  scrollable: false
                                  width: 300
                                  height: 84
                                  bg_opa: TRANSP
                                  border_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: CENTER
                                    flex_align_cross: CENTER
                                    pad_column: 10
                                  widgets:
                                    - image:
                                        id: img_wetter_gross
                                        src: img_w_cloudy
                                        width: 56
                                        height: 56
                                    - obj:
                                        scrollable: false
                                        width: 220
                                        height: 84
                                        bg_opa: TRANSP
                                        border_opa: TRANSP
                                        layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: START }
                                        widgets:
                                          - label:
                                              id: lbl_wetter_temp
                                              text: "--,- °C"
                                              text_font: fridolin_40
                                          - label:
                                              id: lbl_wetter_zustand
                                              text: "—"
                                              text_font: fridolin_14
                              ### Vorschau für die nächsten Stunden, vier Slots nebeneinander
                              - obj:
                                  scrollable: false
                                  width: 300
                                  height: 84
                                  bg_opa: TRANSP
                                  border_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: CENTER
                                    flex_align_cross: CENTER
                                    pad_column: 6
                                  widgets:
                                    - obj:
                                        scrollable: false
                                        width: 68
                                        height: 84
                                        bg_opa: TRANSP
                                        border_opa: TRANSP
                                        layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER }
                                        widgets:
                                          - label: { id: lbl_h0_zeit, text: "--:--", text_font: fridolin_14 }
                                          - image: { id: img_h0_icon, src: img_w_cloudy_s, width: 24, height: 24 }
                                          - label: { id: lbl_h0_temp, text: "--°", text_font: fridolin_20 }
                                    - obj:
                                        scrollable: false
                                        width: 68
                                        height: 84
                                        bg_opa: TRANSP
                                        border_opa: TRANSP
                                        layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER }
                                        widgets:
                                          - label: { id: lbl_h1_zeit, text: "--:--", text_font: fridolin_14 }
                                          - image: { id: img_h1_icon, src: img_w_cloudy_s, width: 24, height: 24 }
                                          - label: { id: lbl_h1_temp, text: "--°", text_font: fridolin_20 }
                                    - obj:
                                        scrollable: false
                                        width: 68
                                        height: 84
                                        bg_opa: TRANSP
                                        border_opa: TRANSP
                                        layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER }
                                        widgets:
                                          - label: { id: lbl_h2_zeit, text: "--:--", text_font: fridolin_14 }
                                          - image: { id: img_h2_icon, src: img_w_cloudy_s, width: 24, height: 24 }
                                          - label: { id: lbl_h2_temp, text: "--°", text_font: fridolin_20 }
                                    - obj:
                                        scrollable: false
                                        width: 68
                                        height: 84
                                        bg_opa: TRANSP
                                        border_opa: TRANSP
                                        layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER }
                                        widgets:
                                          - label: { id: lbl_h3_zeit, text: "--:--", text_font: fridolin_14 }
                                          - image: { id: img_h3_icon, src: img_w_cloudy_s, width: 24, height: 24 }
                                          - label: { id: lbl_h3_temp, text: "--°", text_font: fridolin_20 }

                        ### Oben rechts: Uhrzeit, Datum, Standort - darunter der Morgen-Ausblick
                        - obj:
                            scrollable: false
                            width: 340
                            height: 300
                            bg_opa: TRANSP
                            border_opa: TRANSP
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                              pad_row: 10
                            widgets:
                              - label:
                                  id: lbl_uhrzeit
                                  text: "--:--"
                                  text_font: fridolin_40
                              - label:
                                  id: lbl_datum
                                  text: "--, --.--."
                                  text_font: fridolin_20
                              - label:
                                  id: lbl_wetter_ort
                                  text: "—"
                                  text_font: fridolin_14
                              - obj:
                                  scrollable: false
                                  width: 300
                                  height: 60
                                  bg_opa: TRANSP
                                  border_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: CENTER
                                    flex_align_cross: CENTER
                                    pad_column: 10
                                  widgets:
                                    - image:
                                        id: img_morgen_icon
                                        src: img_w_cloudy_s
                                        width: 24
                                        height: 24
                                    - obj:
                                        scrollable: false
                                        width: 240
                                        height: 60
                                        bg_opa: TRANSP
                                        border_opa: TRANSP
                                        layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: START }
                                        widgets:
                                          - label:
                                              id: lbl_morgen_range
                                              text: "Morgen: --° – --°"
                                              text_font: fridolin_20
                                          - label:
                                              id: lbl_morgen_zustand
                                              text: "—"
                                              text_font: fridolin_14

                  - label:
                      text: "Nach links wischen: Licht"
                      align: BOTTOM_MID
                      y: -12
                      text_font: fridolin_14

                  ### Kleiner Button, öffnet die Einstellungsseite als Overlay
                  ### (kein Bestandteil der Wisch-Reihenfolge)
                  - button:
                      scrollable: false
                      id: btn_einstellungen_oeffnen
                      align: TOP_RIGHT
                      x: -12
                      y: 10
                      width: 40
                      height: 40
                      widgets:
                        - image:
                            src: img_zahnrad
                            align: CENTER
                      on_click:
                        - lvgl.widget.update:
                            id: overlay_einstellungen
                            hidden: false

              ### Seite 2: Licht (bis zu 4 Lichter, nicht belegte Slots sind versteckt)
              - id: tile_licht
                row: 0
                column: 1
                dir: HOR
                widgets:
                  - label:
                      text: "Licht"
                      text_font: fridolin_28
                      align: TOP_MID
                      y: 16
                  - label:
                      id: lbl_keine_lichter
                      text: "Keine Lichter eingerichtet"
                      align: CENTER
                  - obj:
                      scrollable: false
                      align: CENTER
                      width: 720
                      height: 200
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_EVENLY
                        flex_align_cross: CENTER
                      widgets:
                        - button:
                            scrollable: false
                            id: btn_licht_1
                            hidden: true
                            checkable: true
                            width: 160
                            height: 160
                            widgets:
                              - label:
                                  text: "Licht 1"
                                  align: CENTER
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
                                  data:
                                    entity_id: light.fridolin_licht_1
                        - button:
                            scrollable: false
                            id: btn_licht_2
                            hidden: true
                            checkable: true
                            width: 160
                            height: 160
                            widgets:
                              - label:
                                  text: "Licht 2"
                                  align: CENTER
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
                                  data:
                                    entity_id: light.fridolin_licht_2
                        - button:
                            scrollable: false
                            id: btn_licht_3
                            hidden: true
                            checkable: true
                            width: 160
                            height: 160
                            widgets:
                              - label:
                                  text: "Licht 3"
                                  align: CENTER
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
                                  data:
                                    entity_id: light.fridolin_licht_3
                        - button:
                            scrollable: false
                            id: btn_licht_4
                            hidden: true
                            checkable: true
                            width: 160
                            height: 160
                            widgets:
                              - label:
                                  text: "Licht 4"
                                  align: CENTER
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
                                  data:
                                    entity_id: light.fridolin_licht_4

              ### Seite 3: Heizung (ohne eingerichtete Heizung nur ein Hinweistext)
              ### Seite 3: Klimaanlage (Heizen/Kühlen/Aus, Eco/Normal/Max,
              ### Zieltemperatur) - vom Aufbau wie die Kühlbox-Seite: großer
              ### Zieltemperatur-Wert in einem zweifarbigen Ring (blau oberhalb
              ### der Ist-Temperatur, rot darunter), Modus links, Programm rechts.
              - id: tile_heizung
                row: 0
                column: 2
                dir: HOR
                widgets:
                  - label:
                      text: "Klimaanlage"
                      text_font: fridolin_28
                      align: TOP_MID
                      y: 16
                  - label:
                      id: lbl_keine_heizung
                      text: "Keine Klimaanlage eingerichtet"
                      align: CENTER
                  ### Zweifarbiger Ring: unterer Teil (bis zur Ist-Temperatur) rot,
                  ### oberer Teil (ab der Ist-Temperatur) blau. Beide Ringe teilen
                  ### sich Größe/Position, nur ihr Wertebereich wird per Lambda an
                  ### die Ist-Temperatur angepasst (sync_klima_ist).
                  - arc:
                      id: arc_klima_kalt
                      hidden: true
                      align: CENTER
                      y: -10
                      width: 260
                      height: 260
                      min_value: 16
                      max_value: 30
                      value: 16
                      start_angle: 135
                      end_angle: 45
                      adjustable: false
                      main:
                        arc_opa: TRANSP
                      indicator:
                        arc_color: 0xE0663F
                      knob:
                        arc_opa: TRANSP
                        bg_opa: TRANSP
                  - arc:
                      id: arc_klima_warm
                      hidden: true
                      align: CENTER
                      y: -10
                      width: 260
                      height: 260
                      min_value: 16
                      max_value: 30
                      value: 30
                      start_angle: 135
                      end_angle: 45
                      adjustable: false
                      main:
                        arc_opa: TRANSP
                      indicator:
                        arc_color: 0x3FA8DC
                      knob:
                        arc_opa: TRANSP
                        bg_opa: TRANSP
                  - label:
                      id: lbl_klima_status
                      hidden: true
                      text: "--"
                      align: CENTER
                      y: -75
                  - label:
                      id: lbl_zieltemperatur
                      hidden: true
                      text: "21,0 °C"
                      text_font: fridolin_40
                      align: CENTER
                      y: -30
                  - label:
                      id: lbl_klima_ist
                      hidden: true
                      text: "Ist: -- °C"
                      align: CENTER
                      y: 25
                  - button:
                      scrollable: false
                      id: btn_klima_runter
                      hidden: true
                      align: CENTER
                      x: -70
                      y: 140
                      width: 70
                      height: 56
                      widgets:
                        - label:
                            text: "-"
                            text_font: fridolin_28
                            align: CENTER
                      on_click:
                        - homeassistant.action:
                            action: climate.set_temperature
                            data:
                              entity_id: climate.fridolin_heizung
                              temperature: !lambda return id(ha_zieltemperatur).state - 0.5;
                  - button:
                      scrollable: false
                      id: btn_klima_hoch
                      hidden: true
                      align: CENTER
                      x: 70
                      y: 140
                      width: 70
                      height: 56
                      widgets:
                        - label:
                            text: "+"
                            text_font: fridolin_28
                            align: CENTER
                      on_click:
                        - homeassistant.action:
                            action: climate.set_temperature
                            data:
                              entity_id: climate.fridolin_heizung
                              temperature: !lambda return id(ha_zieltemperatur).state + 0.5;
                  - label:
                      id: lbl_klima_modus_titel
                      hidden: true
                      text: "Modus"
                      text_font: fridolin_14
                      align: CENTER
                      x: -290
                      y: -80
                  - button:
                      scrollable: false
                      id: btn_klima_aus
                      hidden: true
                      checkable: true
                      align: CENTER
                      x: -290
                      y: -35
                      width: 120
                      height: 44
                      checked:
                        bg_color: 0x3FA34D
                      widgets:
                        - label:
                            text: "Aus"
                            align: CENTER
                      on_click:
                        - homeassistant.action:
                            action: climate.set_hvac_mode
                            data:
                              entity_id: climate.fridolin_heizung
                              hvac_mode: "off"
                  - button:
                      scrollable: false
                      id: btn_klima_heizen
                      hidden: true
                      checkable: true
                      align: CENTER
                      x: -290
                      y: 17
                      width: 120
                      height: 44
                      checked:
                        bg_color: 0xE0663F
                      widgets:
                        - label:
                            text: "Heizen"
                            align: CENTER
                      on_click:
                        - homeassistant.action:
                            action: climate.set_hvac_mode
                            data:
                              entity_id: climate.fridolin_heizung
                              hvac_mode: "heat"
                  - button:
                      scrollable: false
                      id: btn_klima_kuehlen
                      hidden: true
                      checkable: true
                      align: CENTER
                      x: -290
                      y: 69
                      width: 120
                      height: 44
                      checked:
                        bg_color: 0x3FA8DC
                      widgets:
                        - label:
                            text: "Kühlen"
                            align: CENTER
                      on_click:
                        - homeassistant.action:
                            action: climate.set_hvac_mode
                            data:
                              entity_id: climate.fridolin_heizung
                              hvac_mode: "cool"
                  - label:
                      id: lbl_klima_programm_titel
                      hidden: true
                      text: "Programm"
                      text_font: fridolin_14
                      align: CENTER
                      x: 290
                      y: -80
                  - button:
                      scrollable: false
                      id: btn_klima_eco
                      hidden: true
                      checkable: true
                      align: CENTER
                      x: 225
                      y: -35
                      width: 60
                      height: 50
                      checked:
                        bg_color: 0x3FA34D
                      widgets:
                        - label:
                            text: "ECO"
                            align: CENTER
                      on_click:
                        - homeassistant.action:
                            action: climate.set_preset_mode
                            data:
                              entity_id: climate.fridolin_heizung
                              preset_mode: "eco"
                  - button:
                      scrollable: false
                      id: btn_klima_normal
                      hidden: true
                      checkable: true
                      align: CENTER
                      x: 290
                      y: -35
                      width: 60
                      height: 50
                      checked:
                        bg_color: 0x3FA34D
                      widgets:
                        - label:
                            text: "Normal"
                            text_font: fridolin_14
                            align: CENTER
                      on_click:
                        - homeassistant.action:
                            action: climate.set_preset_mode
                            data:
                              entity_id: climate.fridolin_heizung
                              preset_mode: "normal"
                  - button:
                      scrollable: false
                      id: btn_klima_max
                      hidden: true
                      checkable: true
                      align: CENTER
                      x: 355
                      y: -35
                      width: 60
                      height: 50
                      checked:
                        bg_color: 0x3FA34D
                      widgets:
                        - label:
                            text: "MAX"
                            align: CENTER
                      on_click:
                        - homeassistant.action:
                            action: climate.set_preset_mode
                            data:
                              entity_id: climate.fridolin_heizung
                              preset_mode: "max"

              ### Seite 4: Nivellierung (zwei "Wasserwaagen")
              - id: tile_nivellierung
                row: 0
                column: 3
                dir: HOR
                widgets:
                  - label:
                      text: "Nivellierung"
                      text_font: fridolin_28
                      align: TOP_MID
                      y: 16
                  ### Schematischer Wohnwagen-Grundriss mit Kreuzlibelle: die waagerechte
                  ### Röhre liegt in Fahrtrichtung (Vorne/Hinten), die senkrechte quer dazu
                  ### (Links/Rechts) - im rechten Winkel, wie bei einer echten Kreuzlibelle.
                  ### Die beiden Luftblasen sind eigene Kind-Widgets des Bildes und werden
                  ### per Lambda auf den Koordinaten aus images/wasserwaage.svg verschoben.
                  - image:
                      id: img_wasserwaage_widget
                      src: img_wasserwaage
                      align: TOP_MID
                      y: 52
                      widgets:
                        ### Ovale Blase (wie bei einer echten Wasserwaage), liegend -
                        ### bewegt sich waagerecht in der Vorne/Hinten-Röhre
                        - obj:
                            scrollable: false
                            id: bubble_vh
                            align: TOP_LEFT
                            x: 140
                            y: 129
                            width: 30
                            height: 22
                            radius: 100
                            bg_color: 0xFFFDE7
                            bg_grad_color: 0xE6DFA0
                            bg_grad_dir: VER
                            border_color: 0xB9AE63
                            border_width: 1
                        ### Ovale Blase, stehend - bewegt sich senkrecht in der
                        ### Links/Rechts-Röhre
                        - obj:
                            scrollable: false
                            id: bubble_lr
                            align: TOP_LEFT
                            x: 286
                            y: 125
                            width: 22
                            height: 30
                            radius: 100
                            bg_color: 0xFFFDE7
                            bg_grad_color: 0xE6DFA0
                            bg_grad_dir: VER
                            border_color: 0xB9AE63
                            border_width: 1

                  - obj:
                      scrollable: false
                      align: TOP_MID
                      y: 364
                      width: 500
                      height: 40
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_EVENLY, flex_align_cross: CENTER }
                      widgets:
                        - label:
                            text: "Links/Rechts:"
                            text_font: fridolin_14
                        - label:
                            id: lbl_neigung_lr
                            text: "0,0°"
                            text_font: fridolin_20
                        - label:
                            text: "Vorne/Hinten:"
                            text_font: fridolin_14
                        - label:
                            id: lbl_neigung_vh
                            text: "0,0°"
                            text_font: fridolin_20

                  - button:
                      scrollable: false
                      align: TOP_MID
                      y: 408
                      width: 200
                      height: 50
                      widgets:
                        - label:
                            text: "Nullen"
                            align: CENTER
                      on_click:
                        - script.execute: neigung_nullen

              ### Seite 5: Kuehlbox (Thermostat-Anzeige, Modus, Batterieschutz)
              - id: tile_kuehlbox
                row: 0
                column: 4
                dir: HOR
                widgets:
                  - label:
