kuehlbox_waermer:
  alias: "Kühlbox +1 °C"
  icon: mdi:thermometer-plus
  sequence:
    - action: select.select_option
      target:
        entity_id: select.fridolin_display_kuhlbox_zieltemperatur
      data:
        option: >-
          {% set aktuell = states('select.fridolin_display_kuhlbox_zieltemperatur') | regex_findall_index('-?\\d+') | int(5) %}
          {{ [-20, [20, aktuell + 1] | min] | max }} °C
  mode: single

kuehlbox_kaelter:
  alias: "Kühlbox −1 °C"
  icon: mdi:thermometer-minus
  sequence:
    - action: select.select_option
      target:
        entity_id: select.fridolin_display_kuhlbox_zieltemperatur
      data:
        option: >-
          {% set aktuell = states('select.fridolin_display_kuhlbox_zieltemperatur') | regex_findall_index('-?\\d+') | int(5) %}
          {{ [-20, [20, aktuell - 1] | min] | max }} °C
  mode: single

