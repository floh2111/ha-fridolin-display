### ------------------------------------------------------------------
### LVGL-Oberfläche: 5 Seiten als Wisch-Karussell (tileview)
### Übersicht -> Licht -> Heizung -> Nivellierung
### ------------------------------------------------------------------
lvgl:
  id: ui
  color_depth: 16
  ### War 25% - bei RGB-Parallel-Displays (mipi_rgb) heisst das: LVGL
  ### braucht 4 Render+Flush-Zyklen fuer einen vollen Seitenwechsel statt
  ### einem. Bei Florians erstem Hardware-Test (30.09.2026) zeigten sich
  ### dadurch ein spuerbar traeges/hakeliges Wisch-Karussell und
  ### Grafikfehler bei Bildaenderungen (vermutlich unvollstaendige/
  ### ueberholte Teil-Flushes). 100% (voller Bildschirmpuffer) behebt
  ### beides typischerweise bei RGB-Displays - PSRAM hat mit 8 MB reichlich
  ### Luft (ein voller 800x480-RGB565-Puffer sind nur ~750 KB).
  ### 12.5% (1/8 Bildschirm): ESPHome legt Puffer bis zu dieser Groesse im schnellen
  ### INTERNEN RAM an (alles darueber im langsameren PSRAM) - gemessen: voller
  ### Bildaufbau ~110-135 ms statt ~160 ms bei 100%. Bei 20-25% landet der Puffer
  ### wieder im PSRAM (185 ms, langsamer).
  buffer_size: 12.5%
  default_font: fridolin_20

  theme:
    button:
      bg_color: 0x2B3A55
      bg_opa: COVER
      radius: 12
      checked:
        bg_color: 0xF53B3B
      text_color: 0xFFFFFF
    label:
      text_color: 0xFFFFFF

  pages:
    - id: seiten
      bg_color: 0x101820
      widgets:
        ### Wisch-Karussell: nach links/rechts wischen wechselt die Seite
        - tileview:
            id: tv_seiten
            scroll_one: true
            scrollbar_mode: "OFF"
            bg_color: 0x101820
            tiles:
              ### Seite 1: Übersicht mit Wetter
              - id: tile_uebersicht
                row: 0
                column: 0
                dir: HOR
                widgets:
                  - label:
                      text: "Fridolin"
                      text_font: fridolin_20
                      align: TOP_MID
                      y: 10

                  ### Verbindungs-Hinweis: nur sichtbar, wenn die API-Verbindung zu
                  ### Home Assistant unterbrochen ist (siehe api: on_client_connected/
                  ### on_client_disconnected weiter oben) - Wetter/Licht/Klimaanlage
                  ### zeigen sonst kommentarlos nur noch den letzten bekannten Stand.
                  ### Start-Zustand optimistisch "verbunden" (ausgeblendet), da die
                  ### Verbindung normalerweise innerhalb weniger Sekunden nach dem
                  ### Booten steht.
                  - obj:
                      scrollable: false
                      pad_all: 0
                      id: box_verbindung_verloren
                      align: TOP_LEFT
                      x: 12
                      y: 14
                      width: 150
                      height: 24
                      hidden: true
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: START
                        flex_align_cross: CENTER
                        pad_column: 6
                      widgets:
                        - obj:
                            scrollable: false
                            pad_all: 0
                            width: 12
                            height: 12
                            radius: 6
                            bg_color: 0xF53B3B
                            bg_opa: COVER
                            border_opa: TRANSP
                        - label:
                            text: "Keine Verbindung"
                            text_font: fridolin_14

                  ### Vier Felder -> jetzt zwei Bloecke: links Wetter + Stundenvorhersage
                  ### + Morgen-Ausblick (alle drei untereinander), rechts nur noch
                  ### Uhrzeit/Datum/Standort. Beide Bloecke sowie die Icons darin auf
                  ### Florians Wunsch (echte Hardware, 30.09.2026) groesser als vorher -
                  ### der Morgen-Block ist dafuer vom rechten in den linken Block
                  ### gewandert (lag dort vorher zu eng, dadurch wirkte das Icon nicht
                  ### wie beabsichtigt NEBEN dem Text). "Unten bewusst frei" bleibt
                  ### trotzdem noch etwas Platz.
                  ### flex_align_cross: CENTER (statt vorher START) - der rechte
                  ### Block ist jetzt genauso hoch wie der linke, damit beide
                  ### wirklich auf gleicher Hoehe zentriert nebeneinander stehen
                  ### (vorher wirkte der rechte Block durch die TOP-Ausrichtung
                  ### kleiner/nicht mittig). Hoehe 335 -> 380: bei 335 wurden auf
                  ### echter Hardware Teile abgeschnitten (u.a. die letzte
                  ### Stundenvorhersage-Uhrzeit "09:00" nur noch als "09:0"
                  ### sichtbar) - LVGL schneidet Kind-Elemente an der eigenen
                  ### Box ab (kein "overflow: visible"), und die real gerenderte
                  ### Zeilenhoehe der echten Google-Font lag offenbar ueber der
                  ### grob abgeschaetzten Summe der drei Zeilen. Deutlich mehr
                  ### Reserve statt wieder nur knapp nachzujustieren.
                  - obj:
                      scrollable: false
                      pad_all: 0
                      align: TOP_MID
                      y: 42
                      width: 760
                      height: 400
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER
                      widgets:
                        ### Links: aktuelles Wetter, Stundenvorhersage, Morgen-Ausblick
