  ### ------------------------------------------------------------------
  ### Einstellungsseite: kein eigener Wisch-Seite, sondern ein Overlay
  ### im top_layer, das nur über den Button auf der Übersicht erscheint
  ### ------------------------------------------------------------------
  top_layer:
    widgets:
      - obj:
          scrollable: false
          id: overlay_einstellungen
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x101820
          bg_opa: COVER
          radius: 0
          widgets:
            - label:
                text: "Einstellungen"
                text_font: fridolin_28
                align: TOP_MID
                y: 16

            - label:
                text: "Fahrzeugtyp für die Nivellierungs-Seite:"
                text_font: fridolin_14
                text_align: CENTER
                align: TOP_MID
                y: 66

            - obj:
                scrollable: false
                align: TOP_MID
                y: 96
                width: 340
                height: 50
                bg_opa: TRANSP
                border_opa: TRANSP
                layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_EVENLY, flex_align_cross: CENTER }
                widgets:
                  - button:
                      scrollable: false
                      id: btn_fahrzeug_wohnwagen
                      checkable: true
                      width: 155
                      height: 50
                      widgets:
                        - label:
                            text: "Wohnwagen"
                            align: CENTER
                      on_click:
                        - lambda: 'id(g_fahrzeugtyp_wohnmobil) = false;'
                        - script.execute: sync_fahrzeugtyp
                  - button:
                      scrollable: false
                      id: btn_fahrzeug_wohnmobil
                      checkable: true
                      width: 155
                      height: 50
                      widgets:
                        - label:
                            text: "Wohnmobil"
                            align: CENTER
                      on_click:
                        - lambda: 'id(g_fahrzeugtyp_wohnmobil) = true;'
                        - script.execute: sync_fahrzeugtyp

            - label:
                text: "Fridolins aktuellen Standort für die\nWetteranzeige übernehmen:"
                text_font: fridolin_14
                text_align: CENTER
                align: CENTER
                y: -50

            - button:
                scrollable: false
                id: btn_standort_uebernehmen
                align: CENTER
                y: 0
                width: 320
                height: 70
                widgets:
                  - label:
                      text: "Standort übernehmen"
                      align: CENTER
                on_click:
                  ### Drückt den "Standort übernehmen"-Button der
                  ### Fridolin-Display-Integration in Home Assistant
                  - homeassistant.action:
                      action: button.press
                      data:
                        entity_id: button.fridolin_standort_uebernehmen

            - label:
                id: lbl_standort_status
                text: "Noch kein Standort übernommen"
                text_font: fridolin_14
                text_align: CENTER
                align: CENTER
                y: 60

            - button:
                scrollable: false
                align: BOTTOM_MID
                y: -16
                width: 160
                height: 56
                widgets:
                  - label:
                      text: "Zurück"
                      align: CENTER
                on_click:
                  - lvgl.widget.update:
                      id: overlay_einstellungen
                      hidden: true
