                                  height: 124
                                  bg_opa: TRANSP
                                  border_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: CENTER
                                    flex_align_cross: CENTER
                                    pad_column: 10
                                  widgets:
                                    ### Anzeigegroesse (92) nach zweimaligem Feedback
                                    ### "Icons zu klein" deutlich vergroessert (56 -> 66 -> 92).
                                    - image:
                                        id: img_wetter_gross
                                        src: img_w_cloudy
                                        width: 92
                                        height: 92
                                    ### Feste Breite + text_align statt Auto-Groesse: ohne das
                                    ### blieben bei kuerzer werdendem Text (z.B. "12,3 °C" ->
                                    ### "9,8 °C", oder ein kuerzerer HA-Wetterzustand) Pixelreste
                                    ### des vorherigen, breiteren Textes stehen, da LVGL bei
                                    ### Auto-Groesse nur die NEUE (kleinere) Widget-Flaeche neu
                                    ### zeichnet, nicht die alte - genau das von Florian
                                    ### beobachtete "Pixelfehler unter der aktuellen Temperatur".
