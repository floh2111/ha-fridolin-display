name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  esphome-config:
    name: ESPHome-Konfiguration prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Platzhalter-Secrets bereitstellen
        # esphome config braucht eine secrets.yaml neben der YAML-Datei,
        # damit !secret-Verweise aufgelöst werden können. Für die reine
        # Syntax-/Struktur-Prüfung reichen die Beispielwerte.
        run: cp esphome/secrets.yaml.example esphome/secrets.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ESPHome installieren
        run: pip install esphome

      - name: Konfiguration validieren
        shell: bash
        run: |
          # Wichtig: GitHub Actions führt bash-Steps mit "set -e" aus.
          # Ohne "set +e" hier würde die Shell schon beim fehlschlagenden
          # esphome-Aufruf abbrechen, bevor die eigene Fehlerausgabe
          # unten überhaupt laufen kann.
          overall_code=0
          for f in esphome/wohnwagen-display.yaml esphome/test-esp32-ohne-display.yaml; do
            echo "### Prüfe $f"
            set +e
            esphome config "$f" 2>&1 | tee esphome_output.txt
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 0 ]; then
              overall_code=1
              # Als ::error::-Annotationen ausgeben, damit die eigentliche
              # Fehlermeldung auch über die GitHub-API sichtbar ist, nicht
              # nur im Log-Volltext
              while IFS= read -r line; do
                esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
                echo "::error file=$f::${esc}"
              done < <(tail -n 40 esphome_output.txt)

              # Zusätzlich in die Job-Summary schreiben, als Fallback
              # falls die Annotationen aus irgendeinem Grund nicht
              # sichtbar werden.
              {
                echo "### $f – Fehlerausgabe (letzte 40 Zeilen)"
                echo '```'
                tail -n 40 esphome_output.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$overall_code"

  ha-integration:
    name: Home-Assistant-Integration prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Syntax prüfen
        run: python -m py_compile custom_components/fridolin_display/*.py

      - name: JSON-Dateien prüfen
        run: |
          python -c "
          import json, glob
          for f in glob.glob('custom_components/fridolin_display/**/*.json', recursive=True):
              json.load(open(f))
              print(f, 'OK')
          "

      - name: hassfest (offizielle HA-Integrations-Prüfung)
        uses: home-assistant/actions/hassfest@master
