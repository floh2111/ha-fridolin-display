  ### ------------------------------------------------------------------
  ### Einstellungsseite: kein eigener Wisch-Seite, sondern ein Overlay
  ### im top_layer, das nur über den Button auf der Übersicht erscheint
  ### ------------------------------------------------------------------
  top_layer:
    widgets:
      - obj:
          scrollable: false
          pad_all: 0
          id: overlay_einstellungen
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x101820
          bg_opa: COVER
          radius: 0
          widgets:
            - label:
                text: "Einstellungen"
                text_font: fridolin_28
                align: TOP_MID
                y: 16

            ### Kompletter Inhalt (bis auf Ueberschrift + Zurueck-Knopf) als
            ### EIN vertikaler Flex-Container statt einzeln mit TOP_MID/
            ### CENTER/y gemischt positionierter Elemente. Grund: genau diese
            ### Mischung hat auf echter Hardware zu Ueberlappungen gefuehrt
            ### (u.a. Knopf-Reihe TOP_MID y:96..146 kollidierte mit der
            ### zweizeiligen Einleitung, die CENTER-bezogen bei y:-90 anfing -
            ### beide Anker-Systeme haben nichts voneinander gewusst). Ein
            ### Flex-COLUMN mit pad_row garantiert ueberlappungsfreie Abstaende
            ### unabhaengig von der tatsaechlichen, schwer im Voraus
            ### abschaetzbaren Textzeilenhoehe der echten Google-Font.
            ### Zwei Spalten, oben ausgerichtet: links Fahrzeugtyp + Standby, rechts
            ### Standort (erste Zeile). Eine Spalte war zu hoch und schnitt Knoepfe ab.
            - obj:
                scrollable: false
                pad_all: 0
                align: TOP_MID
                y: 86
                width: 100%
                height: 310
                bg_opa: TRANSP
                border_opa: TRANSP
                layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_EVENLY, flex_align_cross: START }
                widgets:
                  - obj:
                      scrollable: false
                      pad_all: 0
                      width: 380
                      height: 310
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: START, flex_align_cross: CENTER, pad_row: 26 }
                      widgets:
                        - label:
                            text: "Fahrzeugtyp für die Nivellierungs-Seite:"
                            text_font: fridolin_20
                            text_align: CENTER
                            width: 380

                        - obj:
                            scrollable: false
                            pad_all: 0
                            width: 380
                            height: 60
                            bg_opa: TRANSP
                            border_opa: TRANSP
                            layout: { type: FLEX, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 20 }
                            widgets:
                              - button:
                                  scrollable: false
                                  id: btn_fahrzeug_wohnwagen
                                  checkable: true
                                  width: 165
                                  height: 50
                                  checked:
                                    bg_color: 0x3D5A80
                                    bg_opa: COVER
                                  widgets:
                                    - label:
                                        text: "Wohnwagen"
                                        align: CENTER
                                  on_click:
                                    - lambda: 'id(g_fahrzeugtyp_wohnmobil) = false;'
                                    - script.execute: sync_fahrzeugtyp
                              - button:
                                  scrollable: false
                                  id: btn_fahrzeug_wohnmobil
                                  checkable: true
                                  width: 165
                                  height: 50
                                  checked:
                                    bg_color: 0x3D5A80
                                    bg_opa: COVER
                                  widgets:
                                    - label:
                                        text: "Wohnmobil"
                                        align: CENTER
                                  on_click:
                                    - lambda: 'id(g_fahrzeugtyp_wohnmobil) = true;'
                                    - script.execute: sync_fahrzeugtyp

                        - label:
                            id: lbl_standby
                            text: "Display ausschalten nach: 1 Min"
                            text_font: fridolin_20
                            text_align: CENTER
                            width: 380

                        - slider:
                            id: sld_standby
                            width: 300
                            height: 18
                            min_value: 0
                            max_value: 3
                            value: 1
                            on_value:
                              - lambda: |-
                                  static const int minuten[4] = {0, 1, 2, 5};
                                  id(g_standby_min) = minuten[(int) x];
                                  id(sync_standby).execute();

                  - obj:
                      scrollable: false
                      pad_all: 0
                      width: 380
                      height: 310
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: START, flex_align_cross: CENTER, pad_row: 26 }
                      widgets:
                        - label:
                            text: "Fridolins aktuellen Standort für die\nWetteranzeige übernehmen:"
                            text_font: fridolin_20
                            text_align: CENTER
                            width: 380

                        - button:
                            scrollable: false
                            id: btn_standort_uebernehmen
                            width: 320
                            height: 60
                            widgets:
                              - label:
                                  text: "Standort übernehmen"
                                  align: CENTER
                            on_click:
                              ### Drückt den "Standort übernehmen"-Button der
                              ### Fridolin-Display-Integration in Home Assistant
                              - homeassistant.action:
                                  action: button.press
                                  data:
                                    entity_id: button.fridolin_standort_uebernehmen

                        - label:
                            id: lbl_standort_status
                            text: "Noch kein Standort übernommen"
                            text_font: fridolin_20
                            text_align: CENTER
                            width: 380

            - button:
                scrollable: false
                align: BOTTOM_MID
                y: -16
                width: 160
                height: 56
                widgets:
                  - label:
                      text: "Zurück"
                      align: CENTER
                on_click:
                  - lvgl.widget.update:
                      id: overlay_einstellungen
                      hidden: true

      ### Standby-Fangschicht: ueber allem, nur im Standby sichtbar. Die erste
      ### Beruehrung schaltet die Beleuchtung wieder ein und wird hier
      ### "verbraucht" - sie erreicht keinen darunterliegenden Knopf.
      - obj:
          scrollable: false
          pad_all: 0
          id: overlay_wake
          hidden: true
          width: 100%
          height: 100%
          bg_opa: TRANSP
          border_opa: TRANSP
          radius: 0
          on_press:
            - lambda: |-
                id(g_standby_aktiv) = false;
                id(lcdbacklight).turn_on();
            - lvgl.widget.update:
                id: overlay_wake
                hidden: true
