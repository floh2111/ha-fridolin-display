substitutions:
  name: wohnwagen-display
  friendly_name: Fridolin Display

### Grundgerüst
esphome:
  name: ${name}
  friendly_name: ${friendly_name}

### Waveshare ESP32-S3-Touch-LCD-7B (1024x600), 16 MB Flash, 8 MB PSRAM
psram:
  mode: octal
  speed: 80MHz

### Kalibrier-Nullpunkt der Neigung nicht bei jeder Änderung ins Flash schreiben
preferences:
  flash_write_interval: 5min

### Merkt sich Min-/Max-Temperatur für morgen, damit der kombinierte
### Übersichts-Text unabhängig von der Update-Reihenfolge stimmt
globals:
  ### Zeitpunkt (millis) der letzten Kühlbox-Messung, für die Anzeige Verbunden/Getrennt
  - id: g_kb_letzte
    type: uint32_t
    restore_value: false
    initial_value: '0'
  ### Kalibrierung Neigungssensor: Nullpunkt-Offsets (bleiben nach Neustart
  ### erhalten) und zuletzt berechnete Rohwinkel
  - id: g_offset_lr
    type: float
    restore_value: true
    initial_value: '0'
  - id: g_offset_vh
    type: float
    restore_value: true
    initial_value: '0'
  - id: g_roh_lr
    type: float
    restore_value: false
    initial_value: '0'
  - id: g_roh_vh
    type: float
    restore_value: false
    initial_value: '0'
  - id: g_morgen_min
    type: float
    restore_value: false
    initial_value: '0'
  - id: g_morgen_max
    type: float
    restore_value: false
    initial_value: '0'

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      # Code im PSRAM ausführen: gibt internen RAM (IRAM) für WLAN + Bluetooth frei
      execute_from_psram: true

logger:

api:
  encryption:
    key: !secret fridolin_api_key

ota:
  - platform: esphome
    password: !secret fridolin_ota_password

wifi:
  ssid: !secret fridolin_wifi_ssid
  password: !secret fridolin_wifi_password
  power_save_mode: none

time:
  - platform: homeassistant
    id: ha_time

### I2C-Bus: Touch-Controller (GT911) und Neigungssensor (GY-521 / MPU6050) hängen hier gemeinsam dran
i2c:
  sda: GPIO08
  scl: GPIO09
  scan: true
  id: bus_a

### IO-Expander des Boards (steuert u.a. Backlight, Reset-Leitungen)
waveshare_io_ch32v003:
  - id: wave_io
    address: 0x24
    i2c_id: bus_a

### ------------------------------------------------------------------
### Display & Touch (Pinbelegung und Timing für das Waveshare ESP32-S3-Touch-LCD-7B, 1024x600)
### ------------------------------------------------------------------
display:
  - platform: mipi_rgb
    model: RPI
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 30MHZ
    dimensions:
      width: 1024
      height: 600
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    reset_pin:
      waveshare_io_ch32v003: wave_io
      number: 3
    hsync_back_porch: 152
    hsync_front_porch: 48
    hsync_pulse_width: 162
    vsync_back_porch: 13
    vsync_front_porch: 3
    vsync_pulse_width: 45
    data_pins:
      red: [1, 2, 42, 41, 40]
      green: [39, 0, 45, 48, 47, 21]
      blue: [14, 38, 18, 17, 10]

### Hintergrundbeleuchtung (über den IO-Expander, dimmbar)
power_supply:
  - id: wave_io_backlight_enable
    pin:
      waveshare_io_ch32v003: wave_io
      number: 2
      mode:
        output: true
    enable_time: 0ms
    keep_on_time: 0ms

output:
  - platform: waveshare_io_ch32v003
    id: pwm_backlight_output
    power_supply: wave_io_backlight_enable
    inverted: true
    zero_means_zero: true
    safe_pwm_levels:
      min_value: 1
      max_value: 247

light:
  - platform: monochromatic
    output: pwm_backlight_output
    name: "Display Hintergrundbeleuchtung"
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 750ms

touchscreen:
  platform: gt911
  id: my_touch
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    waveshare_io_ch32v003: wave_io
    number: 1
    mode: OUTPUT

### ------------------------------------------------------------------
### Kühlbox direkt per Bluetooth (Tuya BLE), ohne Home Assistant.
### Komponente: eigener Fork, fest auf einen geprüften Commit gepinnt.
### Secrets: fridolin_kuehlbox_mac / _device_id / _uuid / _local_key.
### Die Kühlbox nimmt nur EINE Verbindung an: Tuya-App und die Home-
### Assistant-Integration "Tuya BLE" müssen getrennt/deaktiviert sein.
### ------------------------------------------------------------------
external_components:
  - source:
      type: git
      url: https://github.com/floh2111/esphome-tuya-ble-fridolin
      ref: 7186f89a63fea749ca11478fcc43908530ecf697

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms

tuya_ble_tracker:

tuya_ble_client:
  - id: tuya_client

tuya_ble_node:
  - id: kuehlbox
    mac_address: !secret fridolin_kuehlbox_mac
    local_key: !secret fridolin_kuehlbox_local_key
    device_id: !secret fridolin_kuehlbox_device_id
    uuid: !secret fridolin_kuehlbox_uuid
    tuya_ble_client_id: tuya_client
    update_interval: 60s
    max_queued: 5

select:
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 103
    name: "Kuehlbox Modus"
    id: kb_modus_sel
    options: ["MAX", "ECO"]
    on_value:
      - script.execute: sync_kuehlbox
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 104
    name: "Kuehlbox Batterieschutz"
    id: kb_batt_sel
    options: ["L", "M", "H"]
    on_value:
      - script.execute: sync_kuehlbox
  ### Zieltemperatur als Dropdown für Home Assistant (-20 bis 20 °C)
  - platform: template
    name: "Kuehlbox Zieltemperatur"
    id: kb_ziel_auswahl
    optimistic: true
    options:
      - "-20 °C"
      - "-19 °C"
      - "-18 °C"
      - "-17 °C"
      - "-16 °C"
      - "-15 °C"
      - "-14 °C"
      - "-13 °C"
      - "-12 °C"
      - "-11 °C"
      - "-10 °C"
      - "-9 °C"
      - "-8 °C"
      - "-7 °C"
      - "-6 °C"
      - "-5 °C"
      - "-4 °C"
      - "-3 °C"
      - "-2 °C"
      - "-1 °C"
      - "0 °C"
      - "1 °C"
      - "2 °C"
      - "3 °C"
      - "4 °C"
      - "5 °C"
      - "6 °C"
      - "7 °C"
      - "8 °C"
      - "9 °C"
      - "10 °C"
      - "11 °C"
      - "12 °C"
      - "13 °C"
      - "14 °C"
      - "15 °C"
      - "16 °C"
      - "17 °C"
      - "18 °C"
      - "19 °C"
      - "20 °C"
    set_action:
      - number.set:
          id: kb_ziel
          value: !lambda 'return (float) atoi(x.c_str());'

number:
  ### Interne Zahl: sendet die Zieltemperatur an die Kühlbox (Display und Dropdown nutzen sie)
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 114
    name: "Kuehlbox Zieltemperatur Zahl"
    id: kb_ziel
    internal: true
    unit_of_measurement: "°C"
    min_value: -20
    max_value: 20
    step: 1
    mode: box
    on_value:
      - lambda: |-
          id(kb_ziel_auswahl).publish_state(str_sprintf("%d °C", (int) roundf(x)));
      - script.execute: sync_kuehlbox

### Anzeige regelmäßig auffrischen (Verbunden/Getrennt hängt an der Zeit seit der letzten Messung)
interval:
  - interval: 10s
    then:
      - script.execute: sync_kuehlbox

switch:
  ### Kühlbox: Power (direkt per Bluetooth)
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 101
    name: "Kuehlbox Power"
    id: kb_power
    on_turn_on:
      - script.execute: sync_kuehlbox
    on_turn_off:
      - script.execute: sync_kuehlbox


### ------------------------------------------------------------------
### Licht & Heizung: das Display steuert nur, die echten Entitäten
### leben in deinem Home Assistant zu Hause. Die entity_ids unten sind
### Platzhalter/Dummy-Namen - einfach gegen deine echten ersetzen.
### ------------------------------------------------------------------

### Heizung: climate-Entität in Home Assistant. Der Zustand (state) einer
### climate-Entität IST der HVAC-Modus (z.B. "heat" oder "off"), darüber
### synchronisieren wir den Heizen-Button
text_sensor:
  ### Licht-Slots 1-4: Status als Text ("on", "off", "unavailable"). Ein
  ### Slot, den du in der Integration leer lässt, existiert in Home Assistant
  ### gar nicht -> es kommt nie ein Zustand an -> der Button bleibt versteckt.
  - platform: homeassistant
    id: ha_licht_1
    entity_id: light.fridolin_licht_1
    on_value:
      - script.execute: sync_lichter

  - platform: homeassistant
    id: ha_licht_2
    entity_id: light.fridolin_licht_2
    on_value:
      - script.execute: sync_lichter

  - platform: homeassistant
    id: ha_licht_3
    entity_id: light.fridolin_licht_3
    on_value:
      - script.execute: sync_lichter

  - platform: homeassistant
    id: ha_licht_4
    entity_id: light.fridolin_licht_4
    on_value:
      - script.execute: sync_lichter

  - platform: homeassistant
    id: ha_heizung_modus
    entity_id: climate.fridolin_heizung
    on_value:
      - script.execute: sync_heizung

  ### Wetterzustand: kommt aus der standortabhängigen REST-Abfrage in
  ### Home Assistant (siehe home-assistant-standort-wetter.yaml), nicht
  ### aus der normalen OpenWeatherMap-Integration mit festem Standort
  - platform: homeassistant
    id: wetter_zustand
    entity_id: sensor.fridolin_wetter_zustand
    on_value:
      - lvgl.label.update:
          id: lbl_wetter_zustand
          text: !lambda return x;

  ### Ort der Wetterstation (laut OpenWeatherMap) als Untertitel der Übersicht
  - platform: homeassistant
    id: wetter_ort
    entity_id: sensor.fridolin_wetter_ort
    on_value:
      - lvgl.label.update:
          id: lbl_wetter_ort
          text: !lambda return x;

  ### Zeitpunkt der letzten Standortübernahme, nur zur Anzeige auf der
  ### Einstellungsseite (Helfer wird von einem HA-Skript gesetzt)
  - platform: homeassistant
    id: ha_standort_status
    entity_id: sensor.fridolin_standort_status
    on_value:
      - lvgl.label.update:
          id: lbl_standort_status
          text: !lambda return x;

  ### Vier Stunden-Slots: nur die Uhrzeit als Text, Temperatur kommt
  ### unten als eigener sensor-Eintrag
  - platform: homeassistant
    id: h0_zeit
    entity_id: sensor.fridolin_wetter_h0_zeit
    on_value:
      - lvgl.label.update: { id: lbl_h0_zeit, text: !lambda return x; }
  - platform: homeassistant
    id: h1_zeit
    entity_id: sensor.fridolin_wetter_h1_zeit
    on_value:
      - lvgl.label.update: { id: lbl_h1_zeit, text: !lambda return x; }
  - platform: homeassistant
    id: h2_zeit
    entity_id: sensor.fridolin_wetter_h2_zeit
    on_value:
      - lvgl.label.update: { id: lbl_h2_zeit, text: !lambda return x; }
  - platform: homeassistant
    id: h3_zeit
    entity_id: sensor.fridolin_wetter_h3_zeit
    on_value:
      - lvgl.label.update: { id: lbl_h3_zeit, text: !lambda return x; }

  ### Ausblick auf morgen: Zustandstext (min/max-Temperatur kommen als
  ### sensor-Einträge weiter unten)
  - platform: homeassistant
    id: morgen_zustand
    entity_id: sensor.fridolin_wetter_morgen_zustand
    on_value:
      - lvgl.label.update:
          id: lbl_morgen_zustand
          text: !lambda return x;

### ------------------------------------------------------------------
### Neigungssensor GY-521 (MPU6050), physisch direkt am ESP32/Display
### für die Nivellierungs-Seite
### ------------------------------------------------------------------
sensor:
  ### Kühlbox-Werte (direkt per Bluetooth)
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 112
    name: "Kuehlbox Temperatur"
    id: kb_ist
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    on_value:
      - lambda: 'id(g_kb_letzte) = millis();'
      - script.execute: sync_kuehlbox
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 123
    name: "Kuehlbox Batterie"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
  - platform: tuya_ble_node
    tuya_ble_node_id: kuehlbox
    dp_id: 122
    name: "Kuehlbox Spannung"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    # Datenpunkt 122 liefert Zehntelvolt (145 = 14,5 V)
    filters:
      - multiply: 0.1

  ### Ziel-/Solltemperatur der climate-Entität (Attribut "temperature")
  - platform: homeassistant
    id: ha_zieltemperatur
    entity_id: climate.fridolin_heizung
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: lbl_zieltemperatur
          text:
            format: "%.1f °C"
            args: ["x"]

  ### Aktuelle Außentemperatur (großer Wert auf der Übersicht)
  - platform: homeassistant
    id: wetter_temp_uebersicht
    entity_id: sensor.fridolin_wetter_temperatur
    on_value:
      - lvgl.label.update:
          id: lbl_wetter_temp
          text:
            format: "%.1f °C"
            args: ["x"]

  ### Temperaturen der vier Stunden-Slots
  - platform: homeassistant
    id: h0_temp
    entity_id: sensor.fridolin_wetter_h0_temp
    on_value:
      - lvgl.label.update: { id: lbl_h0_temp, text: { format: "%.0f°", args: ["x"] } }
  - platform: homeassistant
    id: h1_temp
    entity_id: sensor.fridolin_wetter_h1_temp
    on_value:
      - lvgl.label.update: { id: lbl_h1_temp, text: { format: "%.0f°", args: ["x"] } }
  - platform: homeassistant
    id: h2_temp
    entity_id: sensor.fridolin_wetter_h2_temp
    on_value:
      - lvgl.label.update: { id: lbl_h2_temp, text: { format: "%.0f°", args: ["x"] } }
  - platform: homeassistant
    id: h3_temp
    entity_id: sensor.fridolin_wetter_h3_temp
    on_value:
      - lvgl.label.update: { id: lbl_h3_temp, text: { format: "%.0f°", args: ["x"] } }

  ### Morgen: Minimal- und Maximaltemperatur. Beide Werte werden in den
  ### globals unten gemerkt, damit sich der Label-Text immer komplett
  ### neu aus beiden aktuellen Werten zusammensetzt (kein Aneinanderhängen,
  ### das sich bei jedem HA-Update wiederholen und den Text verlängern würde)
  - platform: homeassistant
    id: morgen_min
    entity_id: sensor.fridolin_wetter_morgen_min
    on_value:
      - globals.set: { id: g_morgen_min, value: !lambda return x; }
      - lvgl.label.update:
          id: lbl_morgen_range
          text:
            format: "Morgen: %.0f° – %.0f°"
            args: ["id(g_morgen_min)", "id(g_morgen_max)"]
  - platform: homeassistant
    id: morgen_max
    entity_id: sensor.fridolin_wetter_morgen_max
    on_value:
      - globals.set: { id: g_morgen_max, value: !lambda return x; }
      - lvgl.label.update:
          id: lbl_morgen_range
          text:
            format: "Morgen: %.0f° – %.0f°"
            args: ["id(g_morgen_min)", "id(g_morgen_max)"]

  - platform: mpu6050
    address: 0x68
    i2c_id: bus_a
    update_interval: 200ms
    accel_x:
      id: accel_x
    accel_y:
      id: accel_y
    accel_z:
      id: accel_z

  ### Kippwinkel links/rechts (Roll) aus den Beschleunigungswerten berechnet
  - platform: template
    id: neigung_links_rechts
    name: Neigung links-rechts
    unit_of_measurement: "°"
    update_interval: 200ms
    lambda: |-
      float roh = atan2(id(accel_y).state, id(accel_z).state) * 180.0 / M_PI;
      id(g_roh_lr) = roh;
      return roh - id(g_offset_lr);
    on_value:
      - lvgl.label.update:
          id: lbl_neigung_lr
          text:
            format: "%.1f°"
            args: ["x"]
      - lvgl.arc.update:
          id: arc_lr
          value: !lambda return (int) x;

  ### Kippwinkel vorne/hinten (Pitch) aus den Beschleunigungswerten berechnet
  - platform: template
    id: neigung_vorne_hinten
    name: Neigung vorne-hinten
    unit_of_measurement: "°"
    update_interval: 200ms
    lambda: |-
      float roh = atan2(-id(accel_x).state, sqrt(id(accel_y).state * id(accel_y).state + id(accel_z).state * id(accel_z).state)) * 180.0 / M_PI;
      id(g_roh_vh) = roh;
      return roh - id(g_offset_vh);
    on_value:
      - lvgl.label.update:
          id: lbl_neigung_vh
          text:
            format: "%.1f°"
            args: ["x"]
      - lvgl.arc.update:
          id: arc_vh
          value: !lambda return (int) x;

### Nullt die Neigungsanzeige auf die aktuelle Lage (auch aus Home Assistant bedienbar)
button:
  - platform: template
    name: Neigung nullen
    on_press:
      - script.execute: neigung_nullen

### ------------------------------------------------------------------
### Nicht belegte Slots ausblenden: Lichter ohne Zustand aus Home Assistant
### und eine nicht eingerichtete Heizung werden auf dem Display versteckt
### ------------------------------------------------------------------
script:
  - id: sync_kuehlbox
    then:
      - lambda: |-
          bool frisch = id(g_kb_letzte) != 0 && (millis() - id(g_kb_letzte)) < 180000;
          bool an = id(kb_power).state;
          bool hat_ziel = id(kb_ziel).has_state();
          bool hat_ist = id(kb_ist).has_state();
          float z = id(kb_ziel).state;
          float ist = id(kb_ist).state;
          const char *status = !frisch ? "Keine Daten" : (!an ? "Aus" : ((hat_ziel && hat_ist && ist > z) ? "Kuehlt" : "Bereit"));
          lv_label_set_text(id(lbl_kb_status), status);
          if (hat_ziel) {
            lv_label_set_text_fmt(id(lbl_kb_ziel), "%d", (int) roundf(z));
            lv_arc_set_value(id(arc_kb), (int) roundf(z));
          }
          if (hat_ist) lv_label_set_text_fmt(id(lbl_kb_ist), "Ist: %d °C", (int) roundf(ist));
          lv_label_set_text(id(lbl_kb_verbindung), frisch ? "Verbunden" : "Getrennt");
          auto setzen = [](lv_obj_t *o, bool an) {
            if (an) lv_obj_add_state(o, LV_STATE_CHECKED);
            else lv_obj_clear_state(o, LV_STATE_CHECKED);
          };
          setzen(id(btn_kb_power), frisch && an);
          auto mi = id(kb_modus_sel).active_index();
          setzen(id(btn_kb_max), mi.has_value() && *mi == 0);
          setzen(id(btn_kb_eco), mi.has_value() && *mi == 1);
          auto bi = id(kb_batt_sel).active_index();
          setzen(id(btn_kb_bl), bi.has_value() && *bi == 0);
          setzen(id(btn_kb_bm), bi.has_value() && *bi == 1);
          setzen(id(btn_kb_bh), bi.has_value() && *bi == 2);

  - id: neigung_nullen
    then:
      - lambda: |-
          id(g_offset_lr) = id(g_roh_lr);
          id(g_offset_vh) = id(g_roh_vh);
      - component.update: neigung_links_rechts
      - component.update: neigung_vorne_hinten

  - id: sync_lichter
    then:
      - lambda: |-
          lv_obj_t *btns[4] = {id(btn_licht_1), id(btn_licht_2), id(btn_licht_3), id(btn_licht_4)};
          text_sensor::TextSensor *ts[4] = {id(ha_licht_1), id(ha_licht_2), id(ha_licht_3), id(ha_licht_4)};
          int sichtbar = 0;
          for (int i = 0; i < 4; i++) {
            const std::string &s = ts[i]->state;
            bool da = ts[i]->has_state() && !s.empty() && s != "unavailable" && s != "unknown";
            if (da) {
              lv_obj_clear_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
              sichtbar++;
            } else {
              lv_obj_add_flag(btns[i], LV_OBJ_FLAG_HIDDEN);
            }
            if (s == "on") lv_obj_add_state(btns[i], LV_STATE_CHECKED);
            else lv_obj_clear_state(btns[i], LV_STATE_CHECKED);
          }
          if (sichtbar > 0) lv_obj_add_flag(id(lbl_keine_lichter), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(lbl_keine_lichter), LV_OBJ_FLAG_HIDDEN);

  - id: sync_heizung
    then:
      - lambda: |-
          const std::string &s = id(ha_heizung_modus).state;
          bool da = id(ha_heizung_modus).has_state() && !s.empty() && s != "unavailable" && s != "unknown";
          lv_obj_t *steuerung[3] = {id(lbl_zieltemperatur), id(row_heizung_temp), id(btn_heizen)};
          for (lv_obj_t *o : steuerung) {
            if (da) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
          if (da) lv_obj_add_flag(id(lbl_keine_heizung), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(lbl_keine_heizung), LV_OBJ_FLAG_HIDDEN);
          if (s == "heat") lv_obj_add_state(id(btn_heizen), LV_STATE_CHECKED);
          else lv_obj_clear_state(id(btn_heizen), LV_STATE_CHECKED);

### ------------------------------------------------------------------
### LVGL-Oberfläche: 5 Seiten als Wisch-Karussell (tileview)
### Übersicht -> Licht -> Heizung -> Nivellierung
### ------------------------------------------------------------------
lvgl:
  id: ui
  color_depth: 16
  buffer_size: 25%
  default_font: montserrat_20

  theme:
    button:
      bg_color: 0x2B3A55
      bg_opa: COVER
      radius: 12
      checked:
        bg_color: 0xF53B3B
      text_color: 0xFFFFFF
    label:
      text_color: 0xFFFFFF

  pages:
    - id: seiten
      bg_color: 0x101820
      widgets:
        ### Wisch-Karussell: nach links/rechts wischen wechselt die Seite
        - tileview:
            id: tv_seiten
            scrollbar_mode: "OFF"
            bg_color: 0x101820
            tiles:
              ### Seite 1: Übersicht mit Wetter
              - id: tile_uebersicht
                row: 0
                column: 0
                dir: HOR
                widgets:
                  - label:
                      text: "Fridolin"
                      text_font: montserrat_28
                      align: TOP_MID
                      y: 12
                  - label:
                      id: lbl_wetter_ort
                      text: "Übersicht"
                      text_font: montserrat_14
                      align: TOP_MID
                      y: 44

                  - label:
                      id: lbl_wetter_zustand
                      text: "—"
                      align: TOP_MID
                      y: 74
                  - label:
                      id: lbl_wetter_temp
                      text: "--.- °C"
                      text_font: montserrat_40
                      align: TOP_MID
                      y: 100

                  ### Vorschau für die nächsten Stunden, vier Slots nebeneinander
                  - obj:
                      align: TOP_MID
                      y: 170
                      width: 620
                      height: 76
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_EVENLY
                        flex_align_cross: CENTER
                      widgets:
                        - obj:
                            width: 130
                            height: 76
                            bg_opa: TRANSP
                            border_opa: TRANSP
                            layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER }
                            widgets:
                              - label: { id: lbl_h0_zeit, text: "--:--", text_font: montserrat_14 }
                              - label: { id: lbl_h0_temp, text: "--°", text_font: montserrat_20 }
                        - obj:
                            width: 130
                            height: 76
                            bg_opa: TRANSP
                            border_opa: TRANSP
                            layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER }
                            widgets:
                              - label: { id: lbl_h1_zeit, text: "--:--", text_font: montserrat_14 }
                              - label: { id: lbl_h1_temp, text: "--°", text_font: montserrat_20 }
                        - obj:
                            width: 130
                            height: 76
                            bg_opa: TRANSP
                            border_opa: TRANSP
                            layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER }
                            widgets:
                              - label: { id: lbl_h2_zeit, text: "--:--", text_font: montserrat_14 }
                              - label: { id: lbl_h2_temp, text: "--°", text_font: montserrat_20 }
                        - obj:
                            width: 130
                            height: 76
                            bg_opa: TRANSP
                            border_opa: TRANSP
                            layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER }
                            widgets:
                              - label: { id: lbl_h3_zeit, text: "--:--", text_font: montserrat_14 }
                              - label: { id: lbl_h3_temp, text: "--°", text_font: montserrat_20 }

                  ### Kurzer Ausblick auf morgen
                  - label:
                      id: lbl_morgen_range
                      text: "Morgen: --° – --°"
                      text_font: montserrat_20
                      align: TOP_MID
                      y: 262
                  - label:
                      id: lbl_morgen_zustand
                      text: "—"
                      text_font: montserrat_14
                      align: TOP_MID
                      y: 292

                  - label:
                      text: "Nach links wischen: Licht"
                      align: BOTTOM_MID
                      y: -12
                      text_font: montserrat_14

                  ### Kleiner Button, öffnet die Einstellungsseite als Overlay
                  ### (kein Bestandteil der Wisch-Reihenfolge)
                  - button:
                      id: btn_einstellungen_oeffnen
                      align: TOP_RIGHT
                      x: -12
                      y: 10
                      width: 40
                      height: 40
                      widgets:
                        - label:
                            text: "⚙"
                            align: CENTER
                      on_click:
                        - lvgl.widget.update:
                            id: overlay_einstellungen
                            hidden: false

              ### Seite 2: Licht (bis zu 4 Lichter, nicht belegte Slots sind versteckt)
              - id: tile_licht
                row: 0
                column: 1
                dir: HOR
                widgets:
                  - label:
                      text: "Licht"
                      text_font: montserrat_28
                      align: TOP_MID
                      y: 16
                  - label:
                      id: lbl_keine_lichter
                      text: "Keine Lichter eingerichtet"
                      align: CENTER
                  - obj:
                      align: CENTER
                      width: 720
                      height: 200
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_EVENLY
                        flex_align_cross: CENTER
                      widgets:
                        - button:
                            id: btn_licht_1
                            hidden: true
                            checkable: true
                            width: 160
                            height: 160
                            widgets:
                              - label:
                                  text: "Licht 1"
                                  align: CENTER
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
                                  data:
                                    entity_id: light.fridolin_licht_1
                        - button:
                            id: btn_licht_2
                            hidden: true
                            checkable: true
                            width: 160
                            height: 160
                            widgets:
                              - label:
                                  text: "Licht 2"
                                  align: CENTER
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
                                  data:
                                    entity_id: light.fridolin_licht_2
                        - button:
                            id: btn_licht_3
                            hidden: true
                            checkable: true
                            width: 160
                            height: 160
                            widgets:
                              - label:
                                  text: "Licht 3"
                                  align: CENTER
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
                                  data:
                                    entity_id: light.fridolin_licht_3
                        - button:
                            id: btn_licht_4
                            hidden: true
                            checkable: true
                            width: 160
                            height: 160
                            widgets:
                              - label:
                                  text: "Licht 4"
                                  align: CENTER
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
                                  data:
                                    entity_id: light.fridolin_licht_4

              ### Seite 3: Heizung (ohne eingerichtete Heizung nur ein Hinweistext)
              - id: tile_heizung
                row: 0
                column: 2
                dir: HOR
                widgets:
                  - label:
                      text: "Heizung"
                      text_font: montserrat_28
                      align: TOP_MID
                      y: 16
                  - label:
                      id: lbl_keine_heizung
                      text: "Keine Heizung eingerichtet"
                      align: CENTER
                  - label:
                      id: lbl_zieltemperatur
                      hidden: true
                      text: "21.0 °C"
                      text_font: montserrat_40
                      align: CENTER
                      y: -60
                  - obj:
                      id: row_heizung_temp
                      hidden: true
                      align: CENTER
                      y: 20
                      width: 300
                      height: 60
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_EVENLY
                        flex_align_cross: CENTER
                      widgets:
                        - button:
                            width: 80
                            height: 60
                            widgets:
                              - label:
                                  text: "-"
                                  text_font: montserrat_28
                            on_click:
                              - homeassistant.action:
                                  action: climate.set_temperature
                                  data:
                                    entity_id: climate.fridolin_heizung
                                    temperature: !lambda return id(ha_zieltemperatur).state - 0.5;
                        - button:
                            width: 80
                            height: 60
                            widgets:
                              - label:
                                  text: "+"
                                  text_font: montserrat_28
                            on_click:
                              - homeassistant.action:
                                  action: climate.set_temperature
                                  data:
                                    entity_id: climate.fridolin_heizung
                                    temperature: !lambda return id(ha_zieltemperatur).state + 0.5;
                  - button:
                      id: btn_heizen
                      hidden: true
                      checkable: true
                      align: BOTTOM_MID
                      y: -40
                      width: 220
                      height: 70
                      widgets:
                        - label:
                            text: "Heizen"
                            align: CENTER
                      on_click:
                        ### Umschalten zwischen "heat" und "off", je nachdem was gerade aktiv ist
                        - if:
                            condition:
                              lambda: 'return id(ha_heizung_modus).state == "heat";'
                            then:
                              - homeassistant.action:
                                  action: climate.set_hvac_mode
                                  data:
                                    entity_id: climate.fridolin_heizung
                                    hvac_mode: "off"
                            else:
                              - homeassistant.action:
                                  action: climate.set_hvac_mode
                                  data:
                                    entity_id: climate.fridolin_heizung
                                    hvac_mode: "heat"

              ### Seite 4: Nivellierung (zwei "Wasserwaagen")
              - id: tile_nivellierung
                row: 0
                column: 3
                dir: HOR
                widgets:
                  - label:
                      text: "Nivellierung"
                      text_font: montserrat_28
                      align: TOP_MID
                      y: 16
                  - obj:
                      align: CENTER
                      width: 760
                      height: 320
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_EVENLY
                        flex_align_cross: CENTER
                      widgets:
                        - obj:
                            width: 340
                            height: 300
                            bg_opa: TRANSP
                            border_opa: TRANSP
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                            widgets:
                              - label:
                                  text: "Links / Rechts"
                              - arc:
                                  id: arc_lr
                                  width: 220
                                  height: 220
                                  min_value: -45
                                  max_value: 45
                                  value: 0
                                  start_angle: 135
                                  end_angle: 45
                                  adjustable: false
                              - label:
                                  id: lbl_neigung_lr
                                  text: "0.0°"
                                  text_font: montserrat_28
                        - obj:
                            width: 340
                            height: 300
                            bg_opa: TRANSP
                            border_opa: TRANSP
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                            widgets:
                              - label:
                                  text: "Vorne / Hinten"
                              - arc:
                                  id: arc_vh
                                  width: 220
                                  height: 220
                                  min_value: -45
                                  max_value: 45
                                  value: 0
                                  start_angle: 135
                                  end_angle: 45
                                  adjustable: false
                              - label:
                                  id: lbl_neigung_vh
                                  text: "0.0°"
                                  text_font: montserrat_28
                  - button:
                      align: BOTTOM_MID
                      y: -8
                      width: 200
                      height: 50
                      widgets:
                        - label:
                            text: "Nullen"
                            align: CENTER
                      on_click:
                        - script.execute: neigung_nullen

              ### Seite 5: Kuehlbox (Thermostat-Anzeige, Modus, Batterieschutz)
              - id: tile_kuehlbox
                row: 0
                column: 4
                dir: HOR
                widgets:
                  - label:
                      text: "Kuehlbox"
                      text_font: montserrat_28
                      align: TOP_MID
                      y: 16
                  - label:
                      id: lbl_kb_verbindung
                      text: "Getrennt"
                      text_font: montserrat_14
                      align: TOP_LEFT
                      x: 16
                      y: 22
                  - arc:
                      id: arc_kb
                      align: CENTER
                      y: -10
                      width: 260
                      height: 260
                      min_value: -20
                      max_value: 20
                      value: 0
                      start_angle: 135
                      end_angle: 45
                      adjustable: false
                  - label:
                      id: lbl_kb_status
                      text: "--"
                      align: CENTER
                      y: -75
                  - label:
                      id: lbl_kb_ziel
                      text: "--"
                      text_font: montserrat_40
                      align: CENTER
                      y: -30
                  - label:
                      id: lbl_kb_ist
                      text: "Ist: --"
                      align: CENTER
                      y: 25
                  - button:
                      align: CENTER
                      x: -70
                      y: 140
                      width: 70
                      height: 56
                      widgets:
                        - label:
                            text: "-"
                            text_font: montserrat_28
                            align: CENTER
                      on_click:
                        - number.set:
                            id: kb_ziel
                            value: !lambda 'return std::max(-20.0f, std::min(20.0f, (id(kb_ziel).has_state() ? id(kb_ziel).state : 5.0f) - 1.0f));'
                  - button:
                      align: CENTER
                      x: 70
                      y: 140
                      width: 70
                      height: 56
                      widgets:
                        - label:
                            text: "+"
                            text_font: montserrat_28
                            align: CENTER
                      on_click:
                        - number.set:
                            id: kb_ziel
                            value: !lambda 'return std::max(-20.0f, std::min(20.0f, (id(kb_ziel).has_state() ? id(kb_ziel).state : 5.0f) + 1.0f));'
                  - label:
                      text: "Modus"
                      text_font: montserrat_14
                      align: CENTER
                      x: -290
                      y: -80
                  - button:
                      id: btn_kb_max
                      checkable: true
                      align: CENTER
                      x: -290
                      y: -35
                      width: 120
                      height: 50
                      checked:
                        bg_color: 0x3FA34D
                      widgets:
                        - label:
                            text: "MAX"
                            align: CENTER
                      on_click:
                        - select.set:
                            id: kb_modus_sel
                            option: "MAX"
                  - button:
                      id: btn_kb_eco
                      checkable: true
                      align: CENTER
                      x: -290
                      y: 25
                      width: 120
                      height: 50
                      checked:
                        bg_color: 0x3FA34D
                      widgets:
                        - label:
                            text: "ECO"
                            align: CENTER
                      on_click:
                        - select.set:
                            id: kb_modus_sel
                            option: "ECO"
                  - label:
                      text: "Akku-Schutz"
                      text_font: montserrat_14
                      align: CENTER
                      x: 290
                      y: -80
                  - button:
                      id: btn_kb_bl
                      checkable: true
                      align: CENTER
                      x: 225
                      y: -35
                      width: 60
                      height: 50
                      checked:
                        bg_color: 0x3FA34D
                      widgets:
                        - label:
                            text: "L"
                            align: CENTER
                      on_click:
                        - select.set:
                            id: kb_batt_sel
                            option: "L"
                  - button:
                      id: btn_kb_bm
                      checkable: true
                      align: CENTER
                      x: 290
                      y: -35
                      width: 60
                      height: 50
                      checked:
                        bg_color: 0x3FA34D
                      widgets:
                        - label:
                            text: "M"
                            align: CENTER
                      on_click:
                        - select.set:
                            id: kb_batt_sel
                            option: "M"
                  - button:
                      id: btn_kb_bh
                      checkable: true
                      align: CENTER
                      x: 355
                      y: -35
                      width: 60
                      height: 50
                      checked:
                        bg_color: 0x3FA34D
                      widgets:
                        - label:
                            text: "H"
                            align: CENTER
                      on_click:
                        - select.set:
                            id: kb_batt_sel
                            option: "H"
                  - button:
                      id: btn_kb_power
                      checkable: true
                      align: BOTTOM_MID
                      y: -8
                      width: 200
                      height: 50
                      widgets:
                        - label:
                            text: "Ein/Aus"
                            align: CENTER
                      on_click:
                        - switch.toggle: kb_power
  ### ------------------------------------------------------------------
  ### Einstellungsseite: kein eigener Wisch-Seite, sondern ein Overlay
  ### im top_layer, das nur über den Button auf der Übersicht erscheint
  ### ------------------------------------------------------------------
  top_layer:
    widgets:
      - obj:
          id: overlay_einstellungen
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x101820
          bg_opa: COVER
          radius: 0
          widgets:
            - label:
                text: "Einstellungen"
                text_font: montserrat_28
                align: TOP_MID
                y: 16

            - label:
                text: "Fridolins aktuellen Standort für die\nWetteranzeige übernehmen:"
                text_font: montserrat_14
                text_align: CENTER
                align: CENTER
                y: -60

            - button:
                id: btn_standort_uebernehmen
                align: CENTER
                y: 0
                width: 320
                height: 70
                widgets:
                  - label:
                      text: "Standort übernehmen"
                      align: CENTER
                on_click:
                  ### Drückt den "Standort übernehmen"-Button der
                  ### Fridolin-Display-Integration in Home Assistant
                  - homeassistant.action:
                      action: button.press
                      data:
                        entity_id: button.fridolin_standort_uebernehmen

            - label:
                id: lbl_standort_status
                text: "Noch kein Standort übernommen"
                text_font: montserrat_14
                text_align: CENTER
                align: CENTER
                y: 60

            - button:
                align: BOTTOM_MID
                y: -16
                width: 160
                height: 56
                widgets:
                  - label:
                      text: "Zurück"
                      align: CENTER
                on_click:
                  - lvgl.widget.update:
                      id: overlay_einstellungen
                      hidden: true
