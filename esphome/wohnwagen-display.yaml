                                              text_align: LEFT
                              ### Vorschau für die nächsten Stunden, vier Slots nebeneinander.
                              ### width: 360 (= volle Spaltenbreite, statt vorher 350) +
                              ### pad_column: 4 (statt 6) - der letzte Slot ("09:00") wurde
