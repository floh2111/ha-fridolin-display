    on_value:
      - lvgl.image.update:
          id: img_h0_icon
          src:
            mapping: icon_map_klein
            value: !lambda return x;

  - platform: homeassistant
    id: h1_icon
    entity_id: sensor.fridolin_wetter_h1_icon
    on_value:
      - lvgl.image.update:
          id: img_h1_icon
          src:
            mapping: icon_map_klein
            value: !lambda return x;

  - platform: homeassistant
    id: h2_icon
    entity_id: sensor.fridolin_wetter_h2_icon
    on_value:
      - lvgl.image.update:
          id: img_h2_icon
          src:
            mapping: icon_map_klein
            value: !lambda return x;

  - platform: homeassistant
    id: h3_icon
    entity_id: sensor.fridolin_wetter_h3_icon
    on_value:
      - lvgl.image.update:
          id: img_h3_icon
          src:
            mapping: icon_map_klein
