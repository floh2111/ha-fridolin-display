# Kühlbox-Skripte für die Home-Assistant-App (CarPlay / Siri / Dashboard)
#
# Einbinden: Inhalt an die Datei scripts.yaml anhängen (Einstellungen ->
# Automationen & Szenen -> Skripte -> Drei-Punkte-Menü -> "In YAML bearbeiten"
# geht pro Skript) und danach "Skripte neu laden" ausführen.
#
# Die Entity-IDs unten sind aus den ESPHome-Namen abgeleitet. Falls deine
# anders heißen, per Suchen/Ersetzen anpassen:
#   switch.fridolin_display_kuhlbox_power
#   select.fridolin_display_kuhlbox_zieltemperatur
#   select.fridolin_display_kuhlbox_modus
#
# Die Skripte mit festen Temperaturen schalten die Kühlbox zusätzlich EIN
# (Zeile "switch.turn_on" entfernen, wenn nur der Sollwert gesetzt werden soll).
# Die Optionen der Zieltemperatur heißen "-20 °C" bis "20 °C".

kuehlbox_2_grad:
  alias: "Kühlbox 2 °C"
  icon: mdi:fridge-outline
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.fridolin_display_kuhlbox_power
    - action: select.select_option
      target:
        entity_id: select.fridolin_display_kuhlbox_zieltemperatur
      data:
        option: "2 °C"
  mode: single

