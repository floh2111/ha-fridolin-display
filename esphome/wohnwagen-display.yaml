                                        scrollable: false
                                        pad_all: 0
                                        width: 248
                                        height: 124
                                        bg_opa: TRANSP
                                        border_opa: TRANSP
                                        layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: START }
                                        widgets:
                                          - label:
                                              id: lbl_wetter_temp
                                              text: "--,- °C"
                                              text_font: fridolin_40
                                              width: 248
                                              text_align: LEFT
                                          - label:
                                              id: lbl_wetter_zustand
                                              text: "—"
                                              text_font: fridolin_14
                                              width: 248
                                              text_align: LEFT
                                          - label:
                                              id: lbl_wetter_regen
                                              text: ""
                                              text_font: fridolin_14
                                              text_color: 0x6CB8FF
